const IOS_APP = (navigator.maxTouchPoints > 1 && /Macintosh|iPad|iPhone/.test(navigator.userAgent) || /iPhone|iPad/.test(navigator.userAgent)) && window.top === window;
function relaunchKeepingPlace(){
  try { const r = JSON.parse(sessionStorage.getItem('plume-relaunch-at') || '0'); if (Date.now() - r < 8000) return; sessionStorage.setItem('plume-relaunch-at', String(Date.now())); } catch(e) {}
  try {
    if (activeId) save();

    // L'historique (annuler / rétablir) et le menu ⋯ ouvert survivent à la relance.
    const st = { y: scrollY, caret: document.activeElement === editor ? caretOffsets() : null, at: Date.now(), menu: !!(popOwner && popOwner.matches && popOwner.matches('.bar [data-menu="doc"]')) };
    try { const k = Math.max(0, hist.i - 40); sessionStorage.setItem('plume-relaunch', JSON.stringify({ ...st, hist: { id: activeId, list: hist.list.slice(k, hist.i + 1), i: hist.i - k } })); }

function syncStatusColor(){

  // le mode sombre) et choisit lui-même au moment où le système change, même app en arrière-plan.

  root.style.backgroundColor = 'var(--bg)';
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.remove());
  const add = (c, media) => { const m = document.createElement('meta'); m.name = 'theme-color'; m.content = c; if (media) m.media = media; document.head.append(m); };

  if (theme === 'auto' && !hostTheme) { add('#ffffff', '(prefers-color-scheme: light)'); add('#000000', '(prefers-color-scheme: dark)'); }

  if (!cs) { cs = document.createElement('meta'); cs.name = 'color-scheme'; document.head.append(cs); }

async function deliver(files){
  if (dlApi) {
    let n = 0;
    for (const f of files) {
      try { await dlApi.save({ filename: f.name, data: f }); n++; }
      catch (e) {
        if (e && e.code === 'declined') return;
        toast(e && e.code === 'rate_limited' ? 'Une fenêtre d\'enregistrement est déjà ouverte.' : "L'enregistrement de fichiers n'est pas disponible ici."); return;
      }
    }
    if (n) toast(n > 1 ? `${n} fichiers enregistrés` : `« ${files[0].name} » enregistré`);
    return;
  }
  if (navigator.canShare && navigator.share) {
    let can = false; try { can = navigator.canShare({ files }); } catch(e) {}
    if (can) {
      try { await navigator.share({ files }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
  }
  try {
    for (const f of files) {
      const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name;
      document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      if (files.length > 1) await new Promise(r => setTimeout(r, 300));
    }
    toast(files.length > 1 ? `${files.length} fichiers enregistrés dans Téléchargements` : `« ${files[0].name} » enregistré dans Téléchargements`);
  } catch(e) { toast("L'enregistrement de fichiers n'est pas autorisé ici."); }
}

      const mark = el.tagName === 'OL' ? `${i + (+el.getAttribute('start') || 1) - 1}.` : el.hasAttribute('data-check') ? (li.dataset.done === '1' ? '- [x]' : '- [ ]') : '-';
      const subs = [...li.children].filter(c => /^(UL|OL)$/.test(c.tagName)).map(s => list(s, depth + 1)).join('\n');
      return '  '.repeat(depth) + mark + ' ' + own + (subs ? '\n' + subs : '');

      if (rows.length) { const n = b.querySelector('tr').children.length; rows.splice(1, 0, '|' + ' --- |'.repeat(n)); }
      out.push(rows.join('\n'));
    } else { const s = inl(b).trim(); if (s) out.push(s); }

}

    return text.split('\n').map((t, k) => (k ? '<w:r><w:br/></w:r>' : '') + `<w:r>${pr ? `<w:rPr>${pr}</w:rPr>` : ''}<w:t xml:space="preserve">${xe(t)}</w:t></w:r>`).join('');
  };
  const runs = (node, p) => {
    let out = '';
    for (const n of node.childNodes) {
      if (n.nodeType === 3) { out += run(n.data.replace(/​/g, ''), p); continue; }
      if (n.nodeType !== 1) continue;
      const t = n.tagName, q = { ...p };
      if (n.classList.contains('math')) { out += run(n.dataset.display === '1' ? `$$${n.dataset.tex}$$` : `$${n.dataset.tex}$`, { ...p, font: 'Cambria Math' }); continue; }
      if (t === 'BR') { out += '<w:r><w:br/></w:r>'; continue; }

      }
      if (n.dataset && n.dataset.n && cmt[n.dataset.n]) {
        const c = cmt[n.dataset.n], firstSp = c.spans[0] === n, lastSp = c.spans[c.spans.length - 1] === n;

      if (t === 'U') q.u = 'single';
      if (t === 'SUB') q.va = 'subscript';

      const u = n.getAttribute('data-u'); if (u) q.u = U_DOCX[u] || 'single';
      const f = n.getAttribute('data-f'); if (f && FONT_BY[f]) q.font = FONT_BY[f][1];

    const live = editor.querySelectorAll('img')[[...root.querySelectorAll('img')].indexOf(img)];

  };
  const align = el => { const a = el.style?.textAlign; return a ? `<w:jc w:val="${{ left:'left', center:'center', right:'right', justify:'both' }[a] || 'left'}"/>` : ''; };
  const para = (el, style, extra = '') => `<w:p><w:pPr>${style ? `<w:pStyle w:val="${style}"/>` : ''}${extra}${align(el)}</w:pPr>${runs(el, {})}</w:p>`;
  const listXml = (el, lvl) => [...el.children].filter(c => c.tagName === 'LI').map(li => {
    const own = li.cloneNode(true); own.querySelectorAll(':scope > ul, :scope > ol').forEach(x => x.remove());
    const num = el.tagName === 'OL' ? 2 : 1, box = el.hasAttribute('data-check') ? (li.dataset.done === '1' ? '☑ ' : '☐ ') : '';
    const p = `<w:p><w:pPr><w:pStyle w:val="ListParagraph"/><w:numPr><w:ilvl w:val="${Math.min(lvl, 8)}"/><w:numId w:val="${box ? 3 : num}"/></w:numPr></w:pPr>${run(box, {})}${runs(own, {})}</w:p>`;

  let body = '';

    const t = b.tagName;

    else if (t === 'UL' || t === 'OL') body += listXml(b, 0);
    else if (t === 'HR') body += '<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="BBBBBB"/></w:pBdr></w:pPr></w:p>';
    else if (t === 'TABLE') {
      const rows = [...b.querySelectorAll('tr')], n = Math.max(1, ...rows.map(r => r.children.length));
      body += `<w:tbl><w:tblPr><w:tblStyle w:val="TableGrid"/><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${['top','left','bottom','right','insideH','insideV'].map(s => `<w:${s} w:val="single" w:sz="4" w:color="BBBBBB"/>`).join('')}</w:tblBorders></w:tblPr><w:tblGrid>${'<w:gridCol/>'.repeat(n)}</w:tblGrid>`
        + rows.map(r => `<w:tr>${[...r.children].map(c => `<w:tc><w:tcPr><w:tcW w:w="0" w:type="auto"/></w:tcPr>${para(c, '')}</w:tc>`).join('')}</w:tr>`).join('') + '</w:tbl><w:p/>';
    } else body += para(b, '');

  const W = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"';

  const lvls = kind => Array.from({ length: 9 }, (_, i) => `<w:lvl w:ilvl="${i}"><w:start w:val="1"/><w:numFmt w:val="${kind === 'bullet' || kind === 'none' ? 'bullet' : ['decimal','lowerLetter','lowerRoman'][i % 3]}"/><w:lvlText w:val="${kind === 'none' ? '' : kind === 'bullet' ? ['•','◦','▪'][i % 3] : `%${i + 1}.`}"/><w:lvlJc w:val="left"/><w:pPr><w:ind w:left="${720 * (i + 1)}" w:hanging="360"/></w:pPr></w:lvl>`).join('');
  const files = [
    { name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Default Extension="jpg" ContentType="image/jpeg"/><Default Extension="gif" ContentType="image/gif"/><Default Extension="webp" ContentType="image/webp"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/></Types>` },
    { name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>` },
    { name: 'word/_rels/document.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/>${rels.join('')}</Relationships>` },
    { name: 'word/styles.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles ${W}><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="${fontName}" w:hAnsi="${fontName}" w:cs="${fontName}"/><w:sz w:val="24"/><w:lang w:val="fr-FR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="160" w:line="${{ serre: 300, normal: 360, large: 440 }[prefs.lh] || 360}" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>`
      + `<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/>${prefs.indent ? '<w:pPr><w:ind w:firstLine="567"/></w:pPr>' : ''}</w:style>`
      + [[1, 40], [2, 32], [3, 26]].map(([n, sz]) => `<w:style w:type="paragraph" w:styleId="Heading${n}"><w:name w:val="heading ${n}"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:before="${n === 1 ? 360 : 280}" w:after="120"/><w:ind w:firstLine="0"/><w:outlineLvl w:val="${n - 1}"/></w:pPr><w:rPr><w:b/><w:sz w:val="${sz}"/></w:rPr></w:style>`).join('')
      + `<w:style w:type="paragraph" w:styleId="Quote"><w:name w:val="Quote"/><w:basedOn w:val="Normal"/><w:pPr><w:pBdr><w:left w:val="single" w:sz="12" w:space="8" w:color="CCCCCC"/></w:pBdr><w:ind w:left="567" w:firstLine="0"/></w:pPr><w:rPr><w:i/></w:rPr></w:style>`
      + `<w:style w:type="paragraph" w:styleId="Code"><w:name w:val="Code"/><w:basedOn w:val="Normal"/><w:pPr><w:shd w:val="clear" w:color="auto" w:fill="F2F2F4"/><w:spacing w:after="0" w:line="260" w:lineRule="auto"/><w:ind w:firstLine="0"/></w:pPr><w:rPr><w:rFonts w:ascii="Menlo" w:hAnsi="Menlo"/><w:sz w:val="19"/></w:rPr></w:style>`
      + `<w:style w:type="paragraph" w:styleId="ListParagraph"><w:name w:val="List Paragraph"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:after="60"/><w:ind w:firstLine="0"/></w:pPr></w:style>`
      + `<w:style w:type="character" w:styleId="Hyperlink"><w:name w:val="Hyperlink"/><w:rPr><w:color w:val="1F5FD1"/><w:u w:val="single"/></w:rPr></w:style>`

/* ---------- Sauvegarde complète ---------- */
function exportBackup(){
  save();
  const data = { app: window.plumeStandalone ? 'World' : 'Plume', format: 1, date: new Date().toISOString(),
    folders, docs: docs.map(d => ({ id: d.id, title: d.title, goal: d.goal || 0, noCheck: d.noCheck ? 1 : 0, folder: d.folder || '', created: d.created || 0, html: store.get('plume-doc:' + d.id) || '' })) };
  const day = new Date().toISOString().slice(0, 10);
  deliver([new File([JSON.stringify(data)], `Sauvegarde ${data.app} ${day}.json`, { type: 'application/json' })]);
}
function importBackup(f){
  const rd = new FileReader();
  rd.onload = () => {
    let data; try { data = JSON.parse(rd.result); } catch(e) { toast("Ce fichier n'est pas une sauvegarde."); return; }
    const list = Array.isArray(data?.docs) ? data.docs.filter(d => d && typeof d.html === 'string') : [];
    if (!list.length) { toast('Aucun document dans cette sauvegarde.'); return; }
    let first = null, ok = true;
    // Chaque document garde son identifiant s'il est libre ; sinon il en reçoit un nouveau et les
    // liens [[…]] des documents restaurés sont mis à jour.
    const map = {}, fmap = {};
    // Dossiers de la sauvegarde : ajoutés (un dossier du même nom au même endroit est réutilisé).
    if (Array.isArray(data.folders)) {
      const pending = data.folders.filter(f => f && f.id && f.name); let guard = 0;
      while (pending.length && guard++ < 500) {
        const f = pending.shift();
        if (f.parent && !(f.parent in fmap) && pending.some(x => x.id === f.parent)) { pending.push(f); continue; }
        const parent = f.parent ? fmap[f.parent] || null : null;
        const same = folders.find(x => x.name === f.name && (x.parent || null) === parent);
        if (same) fmap[f.id] = same.id; else { const nf = { id: newId(), name: String(f.name).slice(0, 60), parent, created: +f.created || Date.now() }; folders.push(nf); fmap[f.id] = nf.id; }
      }
      saveFolders();
    }
    for (const d of list) map[d.id || ''] = d.id && /^[a-z0-9]{4,40}$/.test(d.id) && !docs.some(x => x.id === d.id) ? d.id : newId();
    for (const d of list) {
      const id = map[d.id || '']; first = first || id;
      let html = sanitize(d.html);
      html = html.replace(/href="#doc:([a-z0-9]{4,40})"/g, (m, old) => map[old] ? `href="#doc:${map[old]}"` : m);
      const nd = { id, title: String(d.title || 'Sans titre').slice(0, 60), goal: +d.goal || 0, updated: Date.now(), created: +d.created || Date.now() }; if (d.noCheck) nd.noCheck = true;
      if (d.folder && fmap[d.folder]) nd.folder = fmap[d.folder];
      if (store.set('plume-doc:' + id, html)) docs.push(nd); else ok = false;
    }
    saveDocs(); openDoc(first);
    toast(ok ? `${list.length} document${list.length > 1 ? 's' : ''} restauré${list.length > 1 ? 's' : ''} dans de nouveaux onglets` : "Mémoire pleine : certains documents n'ont pas pu être restaurés.");
  };
  rd.readAsText(f);
}

/* ---------- Statistiques et objectif de mots ---------- */
function docStats(text){
  const words = (text.match(/[\p{L}\p{N}][\p{L}\p{N}'’-]*/gu) || []).length;
  const chars = text.replace(/\n/g, '').length, nospace = text.replace(/\s/g, '').length;
  const sentences = (text.match(/[^.!?…]*[\p{L}\p{N}][^.!?…]*([.!?…]+|$)/gmu) || []).filter(s => /[\p{L}\p{N}]/u.test(s)).length;
  return { words, chars, nospace, sentences };
}
const minutes = (w, per) => { const m = w / per; return m < 1 ? (w ? 'moins d\'une minute' : '0 minute') : Math.round(m) + ' min'; };
const countText = () => { const c = editor.cloneNode(true); c.querySelectorAll('.math,del[data-rv],.ai-sg ins').forEach(x => x.remove()); c.querySelectorAll('br').forEach(b => b.replaceWith('\n')); c.querySelectorAll('p,h1,h2,h3,blockquote,li,div,pre,td,th').forEach(b => b.append('\n\n')); return c.textContent.replace(/\u200b/g, '').trim(); };
function openStats(btn){
  const text = countText(), st = docStats(text), paras = editor.querySelectorAll(':scope > :is(p,h1,h2,h3,blockquote,pre), li').length;
  const sel = selectedText(), ss = sel ? docStats(sel) : null, d = docs.find(x => x.id === activeId), goal = d?.goal || 0;
  const pct = goal ? Math.min(100, Math.round(st.words / goal * 100)) : 0;
  openPop(btn || statusEl, `<div class="stats">
    <div class="st-big"><b>${fmtN(st.words)}</b> mots</div>
    ${ss ? `<div class="st-sel">Sélection : ${fmtN(ss.words)} mots · ${fmtN(ss.chars)} caractères</div>` : ''}
    <dl>
      <dt>Caractères</dt><dd>${fmtN(st.chars)}</dd>
      <dt>Sans les espaces</dt><dd>${fmtN(st.nospace)}</dd>
      <dt>Phrases</dt><dd>${fmtN(st.sentences)}</dd>
      <dt>Paragraphes</dt><dd>${fmtN(paras)}</dd>
      <dt>Temps de lecture</dt><dd>${minutes(st.words, 230)}</dd>
      <dt>Temps de parole</dt><dd>${minutes(st.words, 140)}</dd>
    </dl>
    <div class="hr"></div>
    <label class="st-goal">Objectif de mots<input type="number" inputmode="numeric" min="0" step="50" id="goal-in" value="${goal || ''}" placeholder="aucun"></label>
    <div class="goalbar"${goal ? '' : ' hidden'}><i style="width:${pct}%"></i></div>
    <div class="st-pct"${goal ? '' : ' hidden'}>${pct >= 100 ? 'Objectif atteint 🎉' : `${pct} % · encore ${fmtN(Math.max(0, goal - st.words))} mots`}</div>
  </div>`, p => {
    const inp = p.querySelector('#goal-in');
    inp.addEventListener('input', () => {
      const g = Math.max(0, Math.round(+inp.value || 0));
      if (d) { d.goal = g; d.goalHit = st.words >= g && g > 0; saveDocs(); }
      const pc = g ? Math.min(100, Math.round(st.words / g * 100)) : 0;
      p.querySelector('.goalbar').hidden = p.querySelector('.st-pct').hidden = !g;
      p.querySelector('.goalbar i').style.width = pc + '%';
      p.querySelector('.st-pct').textContent = pc >= 100 ? 'Objectif atteint 🎉' : `${pc} % · encore ${fmtN(Math.max(0, g - st.words))} mots`;
      statusEl.textContent = countLabel();
    });
  });
}
statusEl.addEventListener('click', () => openStats(statusEl));

/* ---------- Panneaux latéraux : plan, historique ---------- */
const sidePanel = $('#side-panel'), spTitle = $('#sp-title'), spBody = $('#sp-body');
let sideKind = null;
function openSide(kind){

$('#sp-close').addEventListener('click', closeSide);
notesBtn.addEventListener('click', () => { if (sideKind) closeSide(); }, true);
function renderSidePanel(){
  if (sideKind === 'history') renderHistory();
  else if (sideKind === 'review') renderReview();

/* ---------- Plan : barre latérale à gauche, comme dans Notes ou Pages ----------
   Tous les titres, rangés (titre 1 > titre 2 > titre 3). Un toucher y emmène ; la flèche replie
   une partie du plan (sans toucher au document). La partie où se trouve le curseur est en bleu. */
const olSide = $('#outline-side'), olBody = $('#ol-body'), olBtn = $('#outline-btn');
let olOpen = false, olClosed = new Set();
const wideScreen = () => innerWidth >= 960;
function setOutline(open, remember = true){
  olOpen = open; olSide.hidden = !open;
  document.body.classList.toggle('outline-open', open);
  olBtn.setAttribute('aria-pressed', open);
  if (remember) store.set('plume-outline', open ? '1' : '0');
  if (open) renderOutline();
}
olBtn.addEventListener('click', () => setOutline(!olOpen));
$('#ol-close').addEventListener('click', () => setOutline(false));
$('#ol-fold').addEventListener('click', () => { foldAll(true); renderOutline(); toast('Sections repliées'); });
$('#ol-unfold').addEventListener('click', () => { foldAll(false); renderOutline(); toast('Sections dépliées'); });
['#ol-fold', '#ol-unfold', '#ol-close'].forEach(k => $(k).addEventListener('mousedown', e => e.preventDefault()));
function renderOutline(){
  if (!olOpen) return;
  const hs = [...editor.querySelectorAll(':scope > :is(h1,h2,h3)')];
  if (!hs.length) { olBody.innerHTML = '<p class="nt-empty">Aucun titre pour l\'instant. Choisis Titre 1, 2 ou 3 dans le menu « Texte » de la barre : ils apparaîtront ici, rangés.</p>'; return; }
  const cur = anchorEl()?.closest('#editor > *');
  let curH = null;
  if (cur) for (const h of hs) { if (h === cur || (h.compareDocumentPosition(cur) & Node.DOCUMENT_POSITION_FOLLOWING)) curH = h; else break; }
  // Pour chaque titre : a-t-il des sous-titres, et l'un de ses parents est-il replié dans le plan ?
  const lv = hs.map(h => +h.tagName[1]), rows = [], stack = [];
  hs.forEach((h, i) => {
    while (stack.length && lv[stack[stack.length - 1]] >= lv[i]) stack.pop();
    const hidden = stack.some(j => olClosed.has(j));
    const kids = i + 1 < hs.length && lv[i + 1] > lv[i];
    const txt = h.textContent.replace(/​/g, '').trim() || 'Sans titre';
    if (!hidden) rows.push(`<div class="ol-row l${lv[i]}${h === curH ? ' on' : ''}" style="--d:${stack.length}">`
      + (kids ? `<button class="ol-tw${olClosed.has(i) ? ' closed' : ''}" data-t="${i}" aria-label="${olClosed.has(i) ? 'Déplier' : 'Replier'}"><svg viewBox="0 0 12 12"><path d="M3 4.5l3 3 3-3"/></svg></button>` : '<span class="ol-tw"></span>')
      + `<button class="ol-i" data-i="${i}" title="${esc(txt)}">${esc(txt)}</button></div>`);
    stack.push(i);
  });
  olBody.innerHTML = rows.join('');
  olBody.querySelector('.ol-row.on')?.scrollIntoView({ block: 'nearest' });
}
olBody.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
olBody.addEventListener('click', e => {
  const t = e.target.closest('[data-t]');
  if (t) { const k = +t.dataset.t; olClosed.has(k) ? olClosed.delete(k) : olClosed.add(k); renderOutline(); return; }
  const b = e.target.closest('[data-i]'); if (!b) return;
  const hs = [...editor.querySelectorAll(':scope > :is(h1,h2,h3)')];
  if (hs[+b.dataset.i]) goToBlock(hs[+b.dataset.i]);
  if (!wideScreen()) setOutline(false, false); // sur petit écran, le plan se range pour laisser voir le texte
});
function revealBlock(el){
  // Les sections repliées qui cachent ce bloc s'ouvrent.
  let lvl = /^H([123])$/.exec(el.tagName) ? +el.tagName[1] : 4;
  for (let p = el.previousElementSibling; p; p = p.previousElementSibling) {
    const m = /^H([123])$/.exec(p.tagName); if (!m) continue;
    if (+m[1] < lvl) { if (p.dataset.fold === '1') delete p.dataset.fold; lvl = +m[1]; }
  }

}
function goToBlock(el){
  // Les sections repliées qui cachent ce titre s'ouvrent.
  let lvl = /^H([123])$/.exec(el.tagName) ? +el.tagName[1] : 4;
  for (let p = el.previousElementSibling; p; p = p.previousElementSibling) {
    const m = /^H([123])$/.exec(p.tagName); if (!m) continue;
    if (+m[1] < lvl) { if (p.dataset.fold === '1') delete p.dataset.fold; lvl = +m[1]; }

}

editor.addEventListener('input', () => { clearTimeout(sideT); sideT = setTimeout(renderOutline, 350); });

/* ---------- Historique des versions ----------
   Une version est gardée automatiquement toutes les 10 minutes d'écriture (25 au plus par document),
   et à la demande. Restaurer une version est réversible : Annuler la défait. */
const verKey = id => 'plume-ver:' + id;
function versions(id = activeId){ try { const v = JSON.parse(store.get(verKey(id)) || '[]'); return Array.isArray(v) ? v : []; } catch(e) { return []; } }
function storeVersions(list, id = activeId){
  while (list.length) { if (store.set(verKey(id), JSON.stringify(list))) return true; list.splice(Math.ceil(list.length / 2)); }
  return false;
}
function addVersion(force){
  if (!activeId) return;
  const html = serialize(), list = versions();
  if (list[0] && list[0].html === html) { if (force) toast('Cette version est déjà enregistrée.'); return; }
  if (!force && list[0] && Date.now() - list[0].t < 10 * 60e3) return;
  if (!html.replace(/<[^>]+>/g, '').trim() && !force) return;
  list.unshift({ t: Date.now(), html, words: docStats(countText()).words });
  storeVersions(list.slice(0, 25));
  if (force) toast('Version enregistrée');
  if (sideKind === 'history') renderHistory();
}
function verDate(t){
  const d = new Date(t), now = new Date(), hm = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  const day = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime(), dd = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  if (dd === day) return `Aujourd'hui, ${hm}`;
  if (day - dd === 864e5) return `Hier, ${hm}`;
  return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }) + ', ' + hm;
}
function renderHistory(preview){
  spTitle.textContent = 'Versions';
  const list = versions();
  if (preview != null && list[preview]) {
    const v = list[preview];
    spBody.innerHTML = `<div class="ver-head"><button class="btn sm" data-a="back">‹ Versions</button><span>${esc(verDate(v.t))}</span></div>
      <div class="ver-prev">${sanitize(v.html)}</div>
      <div class="ver-acts"><button class="btn primary" data-a="restore">Restaurer cette version</button></div>`;
    spBody.querySelectorAll('.ver-prev .math').forEach(renderMath);
    spBody.querySelector('[data-a="back"]').onclick = () => renderHistory();
    spBody.querySelector('[data-a="restore"]').onclick = () => {
      addVersion(true);
      editor.innerHTML = sanitize(v.html); renderAllMath(); refold(); renderNotes(); changed();
      restoreToStart(); toast('Version restaurée. Annuler (Ctrl+Z) revient au texte d\'avant.');
      renderHistory();
    };
    return;
  }
  spBody.innerHTML = `<div class="ver-acts top"><button class="btn" data-a="snap">Enregistrer une version maintenant</button></div>`
    + (list.length ? `<div class="ver-list">${list.map((v, i) => `<button class="ver-i" data-i="${i}"><b>${esc(verDate(v.t))}</b><span>${fmtN(v.words || 0)} mots</span></button>`).join('')}</div>`
                   : '<p class="nt-empty">Pas encore de version. Une version est gardée automatiquement toutes les 10 minutes pendant que tu écris.</p>');
  spBody.querySelector('[data-a="snap"]').onclick = () => { save(); addVersion(true); };
  spBody.querySelectorAll('.ver-i').forEach(b => b.onclick = () => renderHistory(+b.dataset.i));
}

/* ---------- Rechercher et remplacer (et dans tous les onglets) ----------
   Les résultats sont surlignés sans toucher au texte (CSS Custom Highlight). */
const findbar = $('#findbar'), fbQ = $('#fb-q'), fbR = $('#fb-r'), fbCount = $('#fb-count'), fbRes = $('#fb-results');
const HL = typeof CSS !== 'undefined' && CSS.highlights && typeof Highlight === 'function';
let fbHits = [], fbI = -1, fbT = 0;
const BLOCK_SEL = 'p,h1,h2,h3,li,blockquote,pre,td,th,div';
// Le texte de chaque bloc, avec la position de chaque caractère dans le document.
function textBlocks(visibleOnly){
  const out = [];
  for (const b of editor.querySelectorAll(BLOCK_SEL)) {
    if (b.closest('.ai-block') || (visibleOnly && b.closest('.fold-hidden'))) continue;
    const w = document.createTreeWalker(b, NodeFilter.SHOW_TEXT, { acceptNode: n => (n.parentElement.closest(BLOCK_SEL) !== b || n.parentElement.closest('.math,.ai-sg')) ? 2 : 1 });
    let text = ''; const map = [];
    while (w.nextNode()) { const n = w.currentNode; for (let i = 0; i < n.data.length; i++) { if (n.data[i] === '​') continue; text += normCh(n.data[i]); map.push([n, i]); } }
    if (text) out.push({ b, text, map });
  }
  return out;
}
const rangeOf = (blk, k, len) => { const a = blk.map[k], z = blk.map[k + len - 1], r = document.createRange(); r.setStart(a[0], a[1]); r.setEnd(z[0], z[1] + 1); return r; };
const fold = s => s.toLowerCase();
function findAll(q, cs){

  const nq = [...q].map(normCh).join(''), qq = cs ? nq : fold(nq);
  for (const blk of textBlocks()) {
    const t = cs ? blk.text : fold(blk.text);
    for (let k = t.indexOf(qq); k >= 0; k = t.indexOf(qq, k + Math.max(1, qq.length))) hits.push(rangeOf(blk, k, qq.length));
  }
  return hits;
}
function paintFind(){
  if (!HL) return;

  if (findbar.hidden || !fbHits.length) return;
  CSS.highlights.set('find', new Highlight(...fbHits));

}
function runFind(keep){
  fbHits = findAll(fbQ.value, $('#fb-case').checked);
  if (!keep || fbI >= fbHits.length) fbI = fbHits.length ? 0 : -1;
  fbCount.textContent = fbQ.value ? (fbHits.length ? `${fbI + 1} sur ${fmtN(fbHits.length)}` : 'Aucun résultat') : '';

}
function showHit(){
  const r = fbHits[fbI]; if (!r) return;

  if (top0 && top0.classList.contains('fold-hidden')) { revealBlock(top0); changed(); }

  if (rc.top < top || rc.bottom > innerHeight - 80) { twScrollUntil = Date.now() + 600; window.scrollBy({ top: rc.top - innerHeight * .4, behavior: 'smooth' }); }

}
function stepFind(d){ if (!fbHits.length) return; fbI = (fbI + d + fbHits.length) % fbHits.length; showHit(); }
function openFind(){
  closePop(); hideSelbar();
  findbar.hidden = false; document.body.classList.add('finding');
  const sel = selectedText(); if (sel && sel.length < 80 && !sel.includes('\n')) fbQ.value = sel;
  fbQ.focus(); fbQ.select(); runFind(); if (fbHits.length) showHit();
}
function closeFind(){

function replaceRange(r, text){

  const c = document.createRange(); c.setStartAfter(t); c.collapse(true); return t;
}
function replaceOne(){

}
function replaceAll(){

// Dans tous les onglets : une liste de résultats, un clic ouvre le document au bon endroit.
// Même découpage que textBlocks() (document ouvert), pour que les résultats correspondent.
function docText(html){
  const d = new DOMParser().parseFromString(`<body>${html}</body>`, 'text/html'), out = [];
  for (const b of d.body.querySelectorAll(BLOCK_SEL)) {

    const w = d.createTreeWalker(b, NodeFilter.SHOW_TEXT, { acceptNode: n => (n.parentElement.closest(BLOCK_SEL) !== b || n.parentElement.closest('.math,.ai-sg')) ? 2 : 1 });
    let t = ''; while (w.nextNode()) for (const ch of w.currentNode.data) if (ch !== '​') t += normCh(ch);
    if (t) out.push(t);

}
function findInDocs(){
  const q = fbQ.value, cs = $('#fb-case').checked;
  if (!q) { fbRes.hidden = true; return; }
  const nq = [...q].map(normCh).join(''), qq = cs ? nq : fold(nq), out = [];
  for (const d of docs) {
    const blocks = d.id === activeId ? textBlocks().map(b => b.text) : docText(store.get('plume-doc:' + d.id) || '');
    let k = 0;
    for (const text of blocks) {
      const t = cs ? text : fold(text);
      for (let i = t.indexOf(qq); i >= 0; i = t.indexOf(qq, i + Math.max(1, qq.length))) {
        const a = Math.max(0, i - 30), snip = (a ? '…' : '') + esc(text.slice(a, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length, i + q.length + 50));

  fbRes.querySelectorAll('.fb-hit').forEach(b => b.onclick = () => {
    const o = out[+b.dataset.i];

    fbHits = findAll(fbQ.value, $('#fb-case').checked); fbI = Math.min(o.k, fbHits.length - 1);

fbQ.addEventListener('input', () => { clearTimeout(fbT); fbT = setTimeout(() => { runFind(); if (fbHits.length) showHit(); }, 120); });
fbQ.addEventListener('keydown', e => {

fbR.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); replaceOne(); } if (e.key === 'Escape') { e.preventDefault(); closeFind(); } });

$('#fb-prev').onclick = () => stepFind(-1);

$('#fb-rep').onclick = replaceOne;
$('#fb-all').onclick = replaceAll;
$('#fb-case').onchange = () => runFind();
$('#fb-docs').onchange = () => runFind(true);
$('#find-btn').addEventListener('click', () => findbar.hidden ? openFind() : closeFind());
editor.addEventListener('input', () => { if (!findbar.hidden) { clearTimeout(fbT); fbT = setTimeout(() => runFind(true), 300); } });
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;

/* ---------- Vérifier le style ----------
   Mots faibles (« vraiment », « en fait »…), répétitions proches et phrases très longues,
   soulignés sans modifier le texte. */
const WEAK = ['vraiment','très','assez','juste','en fait','du coup','donc','peut-être','plutôt','un peu','quelque chose','chose','choses','certain','certaine','certains','certaines','beaucoup','énormément','totalement','complètement','absolument','simplement','tout à fait','il y a','il y avait','faire','fait','sembler','semble','pratiquement','globalement','littéralement','basiquement','évidemment','bien sûr','actuellement'];
const STOP = new Set('alors aussi autre autres avant avec avoir cette celle celui ceux comme comment dans depuis donc elle elles encore entre être faire leur leurs mais même moins notre nous parce pendant peut plus pour quand quel quelle quelles quels sans selon sont sous tous tout toute toutes très vous votre vos ainsi après avait avaient aurait cela ceci chaque contre déjà dont fois lorsque lui leurs nous puis sera seront sinon sont tant tous trop vers voici voilà'.split(' '));
const weakRe = new RegExp(`(?<![\\p{L}\\p{N}])(${WEAK.map(w => w.replace(/ /g, '\\s+')).join('|')})(?![\\p{L}\\p{N}])`, 'giu');
let styleT = 0;
const stylePill = $('#style-pill');
function styleCheck(){
  if (!HL) { if (prefs.style) { toast("La vérification du style n'est pas disponible sur ce navigateur."); setPref('style', false); } return; }
  ['st-weak','st-rep','st-long'].forEach(n => CSS.highlights.delete(n));
  if (!prefs.style || !checksOn()) { stylePill.hidden = true; return; }
  const weak = [], rep = [], long = [];
  for (const blk of textBlocks(true)) {
    if (blk.b.closest('pre')) continue;
    for (const m of blk.text.matchAll(weakRe)) weak.push(rangeOf(blk, m.index, m[0].length));
    // Répétitions : le même mot (5 lettres ou plus) deux fois à moins de 20 mots d'écart.
    const words = [...blk.text.matchAll(/[\p{L}][\p{L}'’-]{4,}/gu)], seen = new Map();
    words.forEach((m, i) => {
      const w = fold(m[0]).replace(/[’']/g, "'").replace(/s$/, '');
      if (STOP.has(w)) return;
      const prev = seen.get(w);
      if (prev != null && i - prev <= 20) { rep.push(rangeOf(blk, words[prev].index, words[prev][0].length), rangeOf(blk, m.index, m[0].length)); }
      seen.set(w, i);
    });
    // Phrases de plus de 35 mots
    for (const m of blk.text.matchAll(/[^.!?…]+[.!?…]*/gu)) {
      const n = (m[0].match(/[\p{L}\p{N}]+/gu) || []).length;
      if (n > 35) { const lead = m[0].match(/^\s*/)[0].length; long.push(rangeOf(blk, m.index + lead, m[0].length - lead)); }
    }
  }
  if (weak.length) CSS.highlights.set('st-weak', new Highlight(...weak));
  if (rep.length) CSS.highlights.set('st-rep', new Highlight(...rep));
  if (long.length) CSS.highlights.set('st-long', new Highlight(...long));
  const nr = rep.length / 2;
  stylePill.hidden = false;
  stylePill.querySelector('.sp-txt').innerHTML = (weak.length || rep.length || long.length)
    ? `<span class="k weak"></span>${weak.length} mot${weak.length > 1 ? 's' : ''} faible${weak.length > 1 ? 's' : ''}<span class="k rep"></span>${nr} répétition${nr > 1 ? 's' : ''}<span class="k long"></span>${long.length} phrase${long.length > 1 ? 's' : ''} longue${long.length > 1 ? 's' : ''}`
    : 'Style : rien à signaler ✓';
}
editor.addEventListener('input', () => { if (prefs.style) { clearTimeout(styleT); styleT = setTimeout(styleCheck, 500); } });
stylePill.querySelector('.sp-x').addEventListener('click', () => { setPref('style', false); styleCheck(); });

/* ---------- Saisie : majuscule en début de phrase, liens automatiques ---------- */
editor.addEventListener('input', e => {
  if (e.inputType !== 'insertText' || !e.data) return;
  const s = getSelection(); if (!s.rangeCount || !s.isCollapsed) return;
  const n = s.anchorNode, off = s.anchorOffset;
  if (n.nodeType !== 3 || n.parentElement.closest('pre,code,.math,a')) return;
  // Majuscule : la lettre qui vient d'être tapée commence un paragraphe ou suit . ! ? …
  if (prefs.caps && /^\p{Ll}$/u.test(e.data) && off >= 1 && n.data[off - 1] === e.data) {
    const blk = blockOf(n);
    if (blk) {
      const r = document.createRange(); r.setStart(blk, 0); r.setEnd(n, off - 1);
      const before = r.toString().replace(/​/g, '');
      if (!before.trim() || (/[.!?…]["»”)]?[\s ]+$/.test(before) && !/\b(etc|cf|p|ex|M|Mme|vol|chap|fig|art|n°)\.\s+$/i.test(before))) {
        n.data = n.data.slice(0, off - 1) + e.data.toUpperCase() + n.data.slice(off);
        const c = document.createRange(); c.setStart(n, off); c.collapse(true); setRange(c);
      }
    }
  }
  // Lien : une adresse web suivie d'une espace devient cliquable.
  if (e.data === ' ' && off >= 2) {
    const m = /(?:^|[\s( ])((?:https?:\/\/|www\.)[^\s <>]+?)([.,;:!?)]*)[\s ]$/.exec(n.data.slice(0, off));
    if (m) {
      const end = off - 1 - m[2].length, start = end - m[1].length;
      const r = document.createRange(); r.setStart(n, start); r.setEnd(n, end);
      const a = document.createElement('a'); a.href = /^www\./i.test(m[1]) ? 'https://' + m[1] : m[1];
      r.surroundContents(a);
      const after = a.nextSibling;
      if (after && after.nodeType === 3) { const c = document.createRange(); c.setStart(after, Math.min(after.data.length, m[2].length + 1)); c.collapse(true); setRange(c); }
      changed();
    }
  }
});

/* ---------- Liens ---------- */
const linkHost = a => ({ getBoundingClientRect: () => a.getBoundingClientRect(), setAttribute(){} });
function normUrl(u){
  u = u.trim(); if (!u) return '';
  if (/^(https?:|mailto:)/i.test(u)) return u;
  if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(u)) return 'mailto:' + u;
  if (/^[^\s]+\.[^\s]+$/.test(u)) return 'https://' + u;
  return '';
}

    if (n.parentElement?.closest('.ai-sg, .ai-block')) continue;
    first = first || n; last = n;
    if (inMark(n, 'del')) continue;                               // déjà supprimé

    if (ins) { n.remove(); if (!ins.textContent.replace(/​/g, '') && !ins.querySelector('.math,img')) ins.remove(); continue; } // un ajout retiré

/* ---------- Afficher ou masquer les corrections, document par document ----------
   Pour un article copié qu'on ne va pas modifier : ni soulignement d'orthographe, ni
   vérification du style. Le choix est gardé avec le document. */
function checksOn(){ try { const d = docs.find(x => x.id === activeId); return !(d && d.noCheck); } catch(e) { return true; } }
function applyChecks(refresh){
  const on = !!prefs.spell && checksOn();
  if (editor.spellcheck !== on) {
    editor.spellcheck = on;
    // Safari garde les soulignements déjà posés : on fait relire le texte au navigateur.
    if (refresh && document.activeElement === editor) { editor.blur(); requestAnimationFrame(() => editor.focus({ preventScroll: true })); }
  }
  styleCheck();
}



/* ---------- iPad : l'Apple Pencil fait défiler, il n'écrit pas à la main ----------
   iPadOS transforme l'écriture au crayon en texte (Griffonner) dès qu'il trouve une zone
   modifiable sous la pointe. Dès que le crayon approche (ou touche) l'écran, le texte cesse
   d'être modifiable : le crayon fait alors défiler comme le doigt. Un toucher du crayon sur le
   texte, un toucher du doigt ou une touche du clavier le rendent de nouveau modifiable, avec
   le curseur au bon endroit. */
{
  const IPAD = navigator.maxTouchPoints > 1 && /Macintosh|iPad/.test(navigator.userAgent);
  if (IPAD) {
    let lastRange = null, penDown = null;
    const editable = () => editor.contentEditable !== 'false';
    const penMode = () => {
      if (!editable()) return;
      const sel = getSelection();
      if (sel.rangeCount && editor.contains(sel.anchorNode)) lastRange = sel.getRangeAt(0).cloneRange();
      editor.contentEditable = 'false';
    };
    const writeMode = range => {
      if (editable()) return;
      editor.contentEditable = 'true';
      editor.focus({ preventScroll: true });
      const r = range || lastRange || (saved && editor.contains(saved.startContainer) && editor.contains(saved.endContainer) ? saved : null);
      if (r) { const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
    };
    // Crayon qui survole l'écran (Apple Pencil Pro, Apple Pencil 2 sur les iPad récents)
    document.addEventListener('pointermove', e => { if (e.pointerType === 'pen' && !e.buttons && document.activeElement !== editor) penMode(); }, { passive: true });
    document.addEventListener('touchstart', e => {
      const t = e.changedTouches[0]; if (!t) return;
      if (t.touchType === 'stylus') {
        if (!e.target.closest || !e.target.closest('.page')) return;
        penMode(); penDown = { x: t.clientX, y: t.clientY, at: Date.now(), y0: scrollY };
      } else if (e.target.closest && e.target.closest('#editor')) {
        // Toucher du doigt : on écrit de nouveau, là où on touche (le navigateur place le curseur).
        if (!editable()) { editor.contentEditable = 'true'; }
      }
    }, { capture: true, passive: true });
    document.addEventListener('touchend', e => {
      const t = e.changedTouches[0], d = penDown; if (!t || t.touchType !== 'stylus' || !d) return;
      penDown = null;
      const moved = Math.hypot(t.clientX - d.x, t.clientY - d.y) > 8 || Math.abs(scrollY - d.y0) > 8;
      if (moved || Date.now() - d.at > 600) return;
      // Toucher du crayon sur le texte : le curseur s'y place, pour écrire au clavier.
      const r = document.caretRangeFromPoint && document.caretRangeFromPoint(t.clientX, t.clientY);
      if (r && editor.contains(r.startContainer)) setTimeout(() => writeMode(r), 0);
    }, { capture: true, passive: true });
    document.addEventListener('keydown', e => {
      // Cmd/Ctrl+B, I, U, Z… doivent aussi marcher après un passage du crayon.
      if (editable() || /^(Meta|Control|Shift|Alt|CapsLock)$/.test(e.key) || (e.altKey && !e.metaKey && !e.ctrlKey)) return;
      if (document.activeElement && document.activeElement !== document.body && document.activeElement !== editor) return;
      if (e.key.length === 1 || /^(Enter|Backspace|Delete|Arrow)/.test(e.key)) writeMode();
    }, true);
  }
}


/* ---------- Choix segmentés en verre liquide (voir le CSS du même nom) ---------- */
{
  const opts = ch => [...ch.querySelectorAll(':scope > .mi')];
  const place = (ch, instant) => {
    const th = ch.querySelector(':scope > .lg-thumb'), on = opts(ch).find(b => b.getAttribute('aria-checked') === 'true');
    if (!th) return;
    if (!on) { th.style.opacity = '0'; return; }
    if (instant) th.style.transition = 'none';
    th.style.opacity = '1'; th.style.left = on.offsetLeft + 'px'; th.style.width = on.offsetWidth + 'px';
    if (instant) { void th.offsetWidth; th.style.transition = ''; }
  };
  const setup = ch => {
    if (ch.classList.contains('lg-seg') || opts(ch).length < 2) return;
    ch.classList.add('lg-seg');
    const th = document.createElement('span'); th.className = 'lg-thumb'; ch.prepend(th);
    requestAnimationFrame(() => place(ch, true));
    new MutationObserver(() => place(ch)).observe(ch, { subtree: true, attributes: true, attributeFilter: ['aria-checked'] });
    let drag = null;
    ch.addEventListener('pointerdown', e => {
      if (e.button) return;
      drag = { id: e.pointerId, x: e.clientX, moving: false };
    });
    ch.addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.id) return;
      if (!drag.moving) {
        if (Math.abs(e.clientX - drag.x) < 6) return;
        drag.moving = true; ch.classList.add('lg-drag'); ch.setPointerCapture(e.pointerId);
        th.style.opacity = '1';
      }
      const r = ch.getBoundingClientRect(), w = th.offsetWidth || opts(ch)[0].offsetWidth;
      if (!th.offsetWidth) th.style.width = opts(ch)[0].offsetWidth + 'px';
      th.style.left = Math.max(2, Math.min(r.width - w - 2, e.clientX - r.left - w / 2)) + 'px';
    });
    const end = e => {
      if (!drag || e.pointerId !== drag.id) return;
      const d = drag; drag = null;
      if (!d.moving) return;
      ch.classList.remove('lg-drag');
      const c = th.offsetLeft + th.offsetWidth / 2;
      const best = opts(ch).reduce((a, b) => Math.abs(b.offsetLeft + b.offsetWidth / 2 - c) < Math.abs(a.offsetLeft + a.offsetWidth / 2 - c) ? b : a);
      if (best.getAttribute('aria-checked') === 'true') place(ch); else best.click();
      requestAnimationFrame(() => place(ch));
    };
    ch.addEventListener('pointerup', end); ch.addEventListener('pointercancel', end);
  };
  const scan = root => (root.querySelectorAll ? root.querySelectorAll('.chips') : []).forEach(setup);
  new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) { if (n.classList.contains('chips')) setup(n); scan(n); } })
    .observe(document.body, { childList: true, subtree: true });
  scan(document);
}


/* ---------- Verre liquide : capsules de boutons et éclat qui suit le doigt ---------- */
{
  // Regroupe les boutons de la barre (entre deux séparateurs) dans des capsules de verre.
  const group = box => {
    let g = null;
    for (const el of [...box.children]) {
      if (el.classList.contains('sep') || el.classList.contains('tb-group')) { g = null; continue; }
      if (el.id === 'status') { g = null; continue; }
      if (!g) { g = document.createElement('span'); g.className = 'tb-group'; el.before(g); }
      g.append(el);
    }
  };
  group($('.tools')); group($('.meta'));
  // Une capsule dont tous les boutons sont cachés disparaît.
  const tidy = () => document.querySelectorAll('.tb-group').forEach(g => g.hidden = ![...g.children].some(c => getComputedStyle(c).display !== 'none' && !c.hidden));
  tidy(); addEventListener('resize', tidy); setTimeout(tidy, 500);
  // Éclat : la lumière se pose là où est le doigt ou la souris.
  let raf = 0, last = null;
  document.addEventListener('pointermove', e => {
    last = e; if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0; const el = last.target.closest && last.target.closest('.pop, .tb-group');
      if (!el) return;
      const r = el.getBoundingClientRect();
      el.style.setProperty('--mx', (last.clientX - r.left) + 'px'); el.style.setProperty('--my', (last.clientY - r.top) + 'px');
    });
  }, { passive: true });
  document.addEventListener('pointerout', e => { const el = e.target.closest && e.target.closest('.pop, .tb-group'); if (el && !el.contains(e.relatedTarget)) { el.style.removeProperty('--mx'); el.style.removeProperty('--my'); } }, { passive: true });
}


/* ---------- Copier : la mise en forme d'un passage copié en partie est gardée ----------
   (copier « blue » au milieu d'un mot bleu donnait un mot noir une fois collé) */
{
  const FMT = '[data-c],[data-h],[data-u],[data-f],[data-s],b,i,s,u,sub,sup,strong,em,a';
  const onCopy = e => {
    const sel = getSelection(); if (!sel.rangeCount || sel.isCollapsed) return;
    const r = sel.getRangeAt(0); if (!editor.contains(r.commonAncestorContainer)) return;
    const box = document.createElement('div'); box.append(r.cloneContents());
    let a = r.commonAncestorContainer.nodeType === 1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentElement;
    while (a && a !== editor && !a.matches(BLOCKS)) {
      if (a.matches(FMT)) { const w = a.cloneNode(false); w.append(...box.childNodes); box.append(w); }
      a = a.parentElement;
    }
    // Éléments de liste ou lignes de tableau copiés seuls : on remet leur liste ou leur tableau autour.
    const ca = r.commonAncestorContainer.nodeType === 1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentElement;
    if ([...box.children].some(c => c.tagName === 'LI')) { const l = (ca.closest('ul,ol') || document.createElement('ul')).cloneNode(false); l.append(...box.childNodes); box.append(l); }
    else if ([...box.children].some(c => c.tagName === 'TR')) { const t = document.createElement('table'), tb = document.createElement('tbody'); tb.append(...box.childNodes); t.append(tb); box.append(t); }
    else if ([...box.children].some(c => /^T[DH]$/.test(c.tagName))) { const t = document.createElement('table'), tb = document.createElement('tbody'), tr = document.createElement('tr'); tr.append(...box.childNodes); tb.append(tr); t.append(tb); box.append(t); }
    box.querySelectorAll('.ai-sg,.ai-block,.ai-tag').forEach(x => x.remove());
    box.querySelectorAll('.is-cur').forEach(x => x.classList.remove('is-cur'));
    e.clipboardData.setData('text/html', box.innerHTML);
    e.clipboardData.setData('text/plain', sel.toString());
    e.preventDefault();
    if (e.type === 'cut') { if (rvOn) { rvDeleteRange(r.cloneRange()); if (typeof rvMerge === 'function') rvMerge(); changed(); } else document.execCommand('delete'); }
  };
  editor.addEventListener('copy', onCopy); editor.addEventListener('cut', onCopy);
  // Glisser-déposer interne : même contenu que Copier (attributs data-* gardés) et insertion comme un collage.
  let dragSrc = null;
  editor.addEventListener('dragstart', e => { const s = getSelection(); dragSrc = s.rangeCount && !s.isCollapsed && editor.contains(s.getRangeAt(0).commonAncestorContainer) ? s.getRangeAt(0).cloneRange() : null; });
  editor.addEventListener('dragend', () => { dragSrc = null; });
  editor.addEventListener('drop', e => {
    const src = dragSrc; dragSrc = null;
    if (!src || rvOn || e.dataTransfer?.files?.length) return;
    const at = document.caretRangeFromPoint ? document.caretRangeFromPoint(e.clientX, e.clientY) : null;
    if (!at || !editor.contains(at.startContainer)) return;
    e.preventDefault();
    if (src.comparePoint(at.startContainer, at.startOffset) === 0 && !src.collapsed && (at.startContainer !== src.endContainer || at.startOffset !== src.endOffset) && (at.startContainer !== src.startContainer || at.startOffset !== src.startOffset)) return;
    const fake = { clipboardData: new DataTransfer(), preventDefault(){}, type: 'copy' };
    const s = getSelection(); s.removeAllRanges(); s.addRange(src); onCopy(fake);
    const html = fake.clipboardData.getData('text/html');
    if (!hist.before) hist.before = caretOffsets();
    const mark = document.createTextNode(''); at.insertNode(mark);
    const sb = blockOf(src.startContainer); src.deleteContents();
    if (sb && sb.isConnected) { sb.querySelectorAll('span,b,i,u,s,em,strong,a').forEach(x => { if (!x.textContent && !x.querySelector('img,.math,br')) x.remove(); }); if (!sb.textContent.replace(/\u200b/g, '') && !sb.querySelector('img,.math') && !sb.contains(mark)) { if (sb.parentElement === editor && editor.children.length > 1) sb.remove(); else sb.replaceChildren(document.createElement('br')); } }
    const r = document.createRange(); r.setStartAfter(mark); r.collapse(true); mark.remove(); setRange(r); intoBlock(r);
    const tmp = document.createElement('div'); tmp.innerHTML = sanitize(html);
    if (tmp.childNodes.length === 1 && tmp.firstChild.nodeName === 'P') tmp.firstChild.replaceWith(...tmp.firstChild.childNodes);
    if (![...tmp.children].some(c => /^(P|H1|H2|H3|UL|OL|LI|BLOCKQUOTE|PRE|TABLE|HR|DIV)$/.test(c.tagName))) {
      const frag = document.createDocumentFragment(); frag.append(...tmp.childNodes); const first = frag.firstChild, last = frag.lastChild;
      r.insertNode(frag); const c = document.createRange(); if (first && last) { c.setStartBefore(first); c.setEndAfter(last); } setRange(c);
    } else document.execCommand('insertHTML', false, tmp.innerHTML);
    ensureBlocks(); renderMissingMath(); changed();
  });
}

/* ---------- Entrée dans une citation vide : on en sort ; Tab dans un bloc de code : tabulation ---------- */
editor.addEventListener('keydown', e => {
  if (e.isComposing) return;
  const el = anchorEl();
  if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
    const q = el?.closest('blockquote');
    if (q && editor.contains(q) && !q.textContent.replace(/[\s\u200b]/g, '') && !q.querySelector('img,.math')) {
      e.preventDefault(); const p = document.createElement('p'); p.append(document.createElement('br')); q.replaceWith(p); caretIn(p); changed(); return;
    }
  }
  if (e.key === 'Tab' && !e.ctrlKey && !e.metaKey && el?.closest('pre') && editor.contains(el)) { e.preventDefault(); e.stopImmediatePropagation(); document.execCommand('insertText', false, e.shiftKey ? '' : '\t'); }
}, true);

var capCtx = document.createElement('canvas').getContext('2d');
function capAlign() {
  document.querySelectorAll('#font-btn .lbl,#font-btn .full,#para-btn .lbl,#para-btn .full').forEach(el => {
    if (!el.offsetWidth) return;
    el.style.transform = 'none';
    const cs = getComputedStyle(el);
    capCtx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const m = capCtx.measureText('H'), A = m.fontBoundingBoxAscent, D = m.fontBoundingBoxDescent;
    if (!(A > 0) || !(m.actualBoundingBoxAscent > 0)) { el.style.transform = ''; return; }
    const r = el.getBoundingClientRect(), b = el.closest('.tb').getBoundingClientRect();
    const capMid = r.top + r.height / 2 + (A - D) / 2 - m.actualBoundingBoxAscent / 2;
    el.style.transform = `translateY(${(b.top + b.height / 2 - capMid).toFixed(2)}px)`;
  });
}

editor.addEventListener('keydown', e => {
  if (e.key !== 'Backspace' || e.isComposing || e.shiftKey || e.altKey || e.ctrlKey || e.metaKey) return;
  const s = getSelection(); if (!s.rangeCount || !s.isCollapsed) return;

// Joindre deux paragraphes quand l'un d'eux commence ou finit par une formule : les navigateurs
// effaçaient la formule (Safari : tout le paragraphe suivant). On fait la jonction nous-mêmes ;
// à côté d'une formule centrée seule sur sa ligne, le curseur va juste à côté d'elle sans rien effacer.
editor.addEventListener('beforeinput', e => {

  const cur = anchorEl()?.closest('#editor > *'); if (!cur || !TXT.test(cur.tagName)) return;

// Saisie composée (accents par touche morte, clavier japonais, dictée) : même majuscule automatique,
// et en révision le texte composé devient un ajout suivi.
let compStart = null;
editor.addEventListener('compositionstart', () => {
  const s = getSelection(); compStart = s.rangeCount ? caretOffsets() : null;
  // Révision : une sélection remplacée par une lettre accentuée devient une suppression suivie,
  // et on ne compose jamais à l'intérieur d'un passage barré.
  if (rvOn && s.rangeCount && editor.contains(s.anchorNode)) {
    const r = s.getRangeAt(0);
    if (!r.collapsed) { const res = rvDeleteRange(r.cloneRange()); const h = res && res.last ? ((res.last.nodeType === 1 ? res.last : res.last.parentElement)?.closest('del[data-rv]') || res.last) : null; if (h && h.isConnected) rvPlaceAfter(h); changed(true); }

  const st = compStart; compStart = null; const data = e.data || ''; if (!data) return;
  setTimeout(() => {
    const s = getSelection(); if (!s.rangeCount || !s.isCollapsed) return;
    const n = s.anchorNode, off = s.anchorOffset;
    if (n.nodeType !== 3 || off < data.length || n.data.slice(off - data.length, off) !== data) return;
    if (rvOn && !n.parentElement.closest('ins[data-rv]')) {

// Retour arrière au tout début du premier élément d'une liste : la puce s'en va (élément → paragraphe,
// ou remonte d'un niveau dans une sous-liste), comme dans Notes ou Pages.
editor.addEventListener('keydown', e => {
  if (e.key !== 'Backspace' || e.isComposing || e.shiftKey || e.altKey || e.ctrlKey || e.metaKey || rvOn) return;
  const s = getSelection(); if (!s.rangeCount || !s.isCollapsed) return;
  const li = anchorEl()?.closest('li'); if (!li || !editor.contains(li) || li.previousElementSibling) return;

/* ---------- Effacer vite en restant appuyé ----------

   ordinateur (≈ 35 lettres par seconde), puis plus vite encore après 2 s. On s'arrête dès que
   la touche est relâchée (ou si l'iPad n'envoie plus rien), et toujours devant une formule,

{
  let downAt = 0, lastKey = 0, key = '', timer = 0, ticks = 0, released = true;
  const stop = () => { clearInterval(timer); timer = 0; ticks = 0; };
  const blocked = back => {
    const s = getSelection(); if (!s.rangeCount || !s.isCollapsed) return true;
    const blk = anchorEl()?.closest('#editor > *, li, td, th'); if (!blk) return true;
    const t = document.createRange();
    if (back) { t.setStart(blk, 0); t.setEnd(s.anchorNode, s.anchorOffset); } else { t.setStart(s.anchorNode, s.anchorOffset); t.setEnd(blk, blk.childNodes.length); }
    if (!t.toString().replace(/​/g, '') && !t.cloneContents().querySelector('img,.math')) {
      // Bord du paragraphe : on continue dans le paragraphe voisin, comme sur un ordinateur,
      // sauf s'il y a là une formule, une image, un tableau, une liste…
      const TXT = /^(P|H1|H2|H3|BLOCKQUOTE)$/, nb = back ? blk.previousElementSibling : blk.nextElementSibling;
      return !(TXT.test(blk.tagName) && blk.parentElement === editor && nb && TXT.test(nb.tagName) && !nb.querySelector('.math,img') && !blk.querySelector('.math,img'));
    }
    // Le caractère juste à côté est-il une formule, une image… ?
    const n = s.anchorNode, o = s.anchorOffset;
    let sib = null;
    if (n.nodeType === 3) { if (back ? o === 0 : o === n.data.length) sib = back ? n.previousSibling : n.nextSibling; }
    else sib = n.childNodes[back ? o - 1 : o];

    if (e.isComposing || e.metaKey || e.ctrlKey || e.altKey || e.shiftKey || rvOn) { stop(); return; }

}
