let dlApi = null;
if (!window.plumeStandalone && window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(d => { dlApi = d; }, () => {});
async function saveToFiles(all){
  save();
  let files;
  if (all) {
    files = docs.map(d => {
      const box = document.createElement('div'); box.innerHTML = d.id === activeId ? liveHTML() : (store.get('plume-doc:' + d.id) || '');
      box.querySelectorAll('.math:empty').forEach(m => m.textContent = m.dataset.display === '1' ? `$$${m.dataset.tex}$$` : `$${m.dataset.tex}$`);
      return fileFor(box.innerHTML, d.title);
    });
    // Deux onglets au même titre : des noms de fichiers distincts.
    const seen = {};
    files = files.map(f => { const n = seen[f.name] = (seen[f.name] || 0) + 1; return n > 1 ? new File([f], f.name.replace(/\.html$/, ` ${n}.html`), { type: f.type }) : f; });
  } else files = [fileFor(liveHTML(), docs.find(d => d.id === activeId)?.title)];
  if (dlApi) {
    let n = 0;
    for (const f of files) {
      try { await dlApi.save({ filename: f.name, data: f }); n++; }
      catch (e) {
        if (e && e.code === 'declined') return;
        if (e && e.code === 'rate_limited') { toast('Une fenêtre d\'enregistrement est déjà ouverte.'); return; }
        toast("L'enregistrement de fichiers n'est pas disponible ici."); return;
      }
    }
    if (n) toast(n > 1 ? `${n} fichiers enregistrés` : `« ${files[0].name} » enregistré`);
    return;
  }
  // Sur iPhone et iPad : la feuille de partage propose « Enregistrer dans Fichiers » (iCloud Drive).
  if (navigator.canShare && navigator.share) {
    let can = false; try { can = navigator.canShare({ files }); } catch(e) {}
    if (can) {
      try { await navigator.share({ files }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
  }
  // Sinon : téléchargement classique (dossier Téléchargements, dans iCloud Drive par défaut sur iPad).
  try {
    for (const f of files) {
      const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name;
      document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      if (files.length > 1) await new Promise(r => setTimeout(r, 300));
    }
    toast(files.length > 1 ? `${files.length} fichiers enregistrés dans Téléchargements` : `« ${files[0].name} » enregistré dans Téléchargements`);
  } catch(e) { toast("L'enregistrement de fichiers n'est pas autorisé ici."); }
}

function countLabel(){
  const w = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest('.math,.ai-sg ins') ? 2 : 1 });
  let t = ''; while (w.nextNode()) t += w.currentNode.data + ' ';
  t = t.replace(/​/g,'');
  const words = (t.match(/[\p{L}\p{N}][\p{L}\p{N}'’-]*/gu) || []).length;
  // Avec un objectif : « 640 / 1 000 mots », et une petite fête quand il est atteint.
  const d = docs.find(x => x.id === activeId), g = d?.goal || 0;
  statusEl.style.setProperty('--goal', g ? Math.min(100, words / g * 100) + '%' : '0%');
  statusEl.classList.toggle('has-goal', !!g);
  if (g) {
    if (words >= g && !d.goalHit) { d.goalHit = true; saveDocs(); setTimeout(() => toast('Objectif atteint 🎉'), 50); }
    if (words < g && d.goalHit) { d.goalHit = false; saveDocs(); }
    return words.toLocaleString('fr-FR') + ' / ' + g.toLocaleString('fr-FR') + ' mots';
  }

  const spark = '<span class="spark">✦</span>';

    dock.innerHTML = `<span class="msg">${spark}${plural(n, 'proposition')} dans le texte${dockMsg ? ' · ' + esc(dockMsg) : ''}</span>`
      + `<button class="btn" data-a="all-ok">Tout accepter</button><button class="btn" data-a="all-no">Tout refuser</button>`
      + `<button class="btn" data-a="hide" title="Ctrl+Maj+H">${aiHidden ? 'Afficher' : 'Masquer'}</button>`

  } else if (dockMsg) {
    dock.innerHTML = `<span class="msg">${spark}${esc(dockMsg)}</span><button class="btn" data-a="close">OK</button>`;
  } else { dock.hidden = true; return; }
  dock.hidden = false;
}
dock.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
dock.addEventListener('click', e => {
  const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return;

  else if (a === 'hide') setAiHidden(!aiHidden);
  else if (a === 'side') { sideOn = true; store.set('plume-side', '1'); updateDock(); }
  else { closePop(); [...editor.querySelectorAll('.ai-sg, .ai-block:not(.writing)')].forEach(s => resolveAny(s, a === 'all-ok', true)); editor.normalize(); renderMissingMath(); dockMsg = ''; changed(); updateDock(); }
});

const BLOCKS = 'p,h1,h2,h3,blockquote,li,div,pre,td,th';
const blockOf = n => (n.nodeType === 1 ? n : n.parentElement)?.closest(BLOCKS) || null;
function markNew(span){ span.classList.add('new'); setTimeout(() => span.classList.remove('new'), 600); }
function makeSg(type, why, cls){
  const span = document.createElement('span'); span.className = 'ai-sg' + (cls ? ' ' + cls : '');
  span.contentEditable = 'false'; span.dataset.id = String(++sgId); span.title = 'Cliquer pour accepter ou refuser';
  SG.set(span.dataset.id, { type, why }); return span;
}
function insertSg(type, ex, rep, why){
  const r = locate(ex); if (!r) return false;
  if (blockOf(r.startContainer) !== blockOf(r.endContainer)) return false;
  if (r.cloneContents().querySelector('.ai-sg,.math')) return false;
  const span = makeSg(type, why);
  const d = document.createElement('del'); d.append(r.extractContents());
  const i = document.createElement('ins'); i.textContent = rep;
  span.append(d, i); r.insertNode(span); markNew(span);
  return true;
}
function insertIdea(ex, why){
  const span = makeSg('idee', why, 'idea');
  const i = document.createElement('ins'); i.textContent = why; span.append(i);
  const r = ex ? locate(ex) : null;
  if (r) { r.collapse(false); r.insertNode(span); }
  else { const blocks = editor.querySelectorAll(BLOCKS); (blocks[blocks.length - 1] || editor).append(span); }
  markNew(span); return true;
}
function resolveSg(span, accept, quiet){
  SG.delete(span.dataset.id);

  else if (accept) { const t = span.querySelector('ins').textContent; t ? span.replaceWith(document.createTextNode(t)) : span.remove(); }

}
// Pour l'enregistrement, la copie et l'analyse : on remet le texte d'origine.
function resolveSuggestions(root){
  root.querySelectorAll('.ai-block').forEach(x => x.remove());
  root.querySelectorAll('.ai-sg').forEach(x => { const d = x.querySelector('del'); d ? x.replaceWith(...d.childNodes) : x.remove(); });
}
function resolveAny(el, accept, quiet){
  if (!el.classList.contains('ai-block')) return resolveSg(el, accept, quiet);
  SG.delete(el.dataset.id);
  if (accept) {
    const kids = [...el.querySelector('.ai-body').childNodes];
    el.replaceWith(...kids);
    const last = kids[kids.length - 1];
    if (last && last.parentElement === editor && !last.nextElementSibling) { const p = document.createElement('p'); p.append(document.createElement('br')); last.after(p); }
    if (!quiet) renderMissingMath();
  } else el.remove();
  if (!quiet) { if (!pendingCount()) dockMsg = ''; changed(); updateDock(); }
}

function openSgCard(span){

async function runAi(){
  if (!sampleFn || aiBusy) return;
  const sel = selectedText();
  let text = sel || plainText();
  if (!text.trim()) { dockMsg = "Écris d'abord quelques phrases."; updateDock(); return; }
  // Une nouvelle relecture repart du texte d'origine.
  [...editor.querySelectorAll('.ai-sg')].forEach(s => resolveSg(s, false, true)); editor.normalize();
  const cut = text.length > 15000; if (cut) text = text.slice(0, 15000);
  aiCtl = new AbortController(); aiBusy = true;
  dockMsg = 'Claude relit ton texte…'; updateDock();
  let pending = '', placed = 0, lost = 0, clean = false;
  const addLine = line => {
    line = line.trim(); if (!line.startsWith('{')) return;
    let s; try { s = JSON.parse(line); } catch(e) { return; }
    if (s.type === 'aucun') { clean = true; return; }
    if (!TYPES[s.type] || typeof s.explication !== 'string') return;
    const ex = typeof s.extrait === 'string' ? s.extrait : '', rep = typeof s.remplacement === 'string' ? s.remplacement : '';
    let ok;
    if (s.type === 'idee') ok = !!s.explication.trim() && insertIdea(ex, s.explication.trim());
    else ok = !!ex && ex !== rep && insertSg(s.type, ex, rep, s.explication);
    if (ok) placed++; else lost++;
    dockMsg = `${plural(placed, 'proposition')}… Claude continue.`; updateDock();
  };
  try {
    await sampleFn(aiPrompt(text, !!sel), {
      signal: aiCtl.signal, cache: false,
      onText: ({ delta }) => { const lines = (pending + delta).split('\n'); pending = lines.pop(); lines.forEach(addLine); }
    });
    addLine(pending);
    dockMsg = placed
      ? (cut ? 'sur le début du texte seulement (trop long pour une seule relecture)' : '')
      : (clean ? 'Rien à signaler : ton texte est propre.' : lost ? "Claude a proposé des changements, mais les passages n'ont pas été retrouvés. Réessaie." : "Claude n'a rien proposé. Essaie un autre filtre.");
  } catch (e) {
    addLine(pending);
    dockMsg = {
      cancelled: 'Relecture arrêtée.',
      not_granted: "L'accès à Claude a été refusé pour cette page. Recharge-la pour qu'il te soit redemandé.",
      sampling_disabled: "Claude n'est pas disponible pour ce compte.",
      rate_limited: 'Trop de demandes pour le moment. Réessaie dans quelques minutes.',
      session_expired: 'Ta session a expiré. Reconnecte-toi à Claude puis réessaie.',
      prompt_too_large: 'Le texte est trop long. Sélectionne un passage et relis-le.',
      refused: 'Claude a refusé de relire ce texte.'
    }[e && e.code] || 'La relecture a été interrompue. Réessaie.';
    if (e && ['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code)) aiState = 'none';
  } finally {
    aiBusy = false; updateDock();
  }
}

/* ---------- Texte de Claude → HTML du document ----------
   Paragraphes séparés par une ligne vide, "## " pour les titres, "- " pour les listes,
   **gras**, *italique*, et les maths en $…$ / $$…$$ (on accepte aussi \( \) et \[ \]). */
function mdToHTML(src){
  const maths = [];
  let t = String(src).replace(/\r/g, '')
    .replace(/\\\[([\s\S]+?)\\\]/g, (_, x) => `$$${x}$$`)
    .replace(/\\\(([\s\S]+?)\\\)/g, (_, x) => `$${x}$`)
    .replace(/\$\$([\s\S]+?)\$\$/g, (_, x) => { maths.push([x.trim(), 1]); return `\u0000${maths.length - 1}\u0000`; })
    .replace(/(^|[^$\\])\$([^\s$](?:[^$\n]*?[^\s$\\])?)\$/g, (_, p, x) => { maths.push([x, 0]); return `${p}\u0000${maths.length - 1}\u0000`; });
  const inline = str => esc(str)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, '$1<i>$2</i>')
    .replace(/\u0000(\d+)\u0000/g, (_, i) => { const [x, d] = maths[i]; return `<span class="math"${d ? ' data-display="1"' : ''} data-tex="${esc(x)}"></span>`; });
  return t.split(/\n{2,}/).filter(b => b.trim()).map(b => {
    const lines = b.split('\n').filter(l => l.trim());
    if (lines.every(l => /^\s*[-*•]\s+/.test(l))) return '<ul>' + lines.map(l => `<li>${inline(l.replace(/^\s*[-*•]\s+/, ''))}</li>`).join('') + '</ul>';
    if (lines.every(l => /^\s*\d+[.)]\s+/.test(l))) return '<ol>' + lines.map(l => `<li>${inline(l.replace(/^\s*\d+[.)]\s+/, ''))}</li>`).join('') + '</ol>';
    const h = b.match(/^\s*(#{1,3})\s+([^\n]*)$/);
    if (h) { const n = Math.max(2, h[1].length); return `<h${n}>${inline(h[2])}</h${n}>`; }
    return `<p>${lines.map(inline).join('<br>')}</p>`;
  }).join('');
}
// Pendant que Claude écrit, les formules restent en code ; on les met en forme à la fin.
function fillHTML(el, text, final){
  el.innerHTML = mdToHTML(text);
  el.querySelectorAll('.math').forEach(m => {
    if (final) renderMath(m);
    else { m.textContent = m.dataset.display === '1' ? `$$${m.dataset.tex}$$` : `$${m.dataset.tex}$`; m.classList.add('pending'); }
  });
}
function aiError(e, what){
  return {
    cancelled: `${what} arrêtée.`,
    not_granted: "L'accès à Claude a été refusé pour cette page. Recharge-la pour qu'il te soit redemandé.",
    sampling_disabled: "Claude n'est pas disponible pour ce compte.",
    rate_limited: 'Trop de demandes pour le moment. Réessaie dans quelques minutes.',
    session_expired: 'Ta session a expiré. Reconnecte-toi à Claude puis réessaie.',
    prompt_too_large: 'Le texte est trop long pour Claude. Sélectionne un passage plus court.',
    refused: 'Claude a refusé cette demande.'
  }[e && e.code] || `${what} interrompue. Réessaie.`;
}
function aiOff(e){
  if (e && ['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code)) aiState = 'none';
}
function docContext(){ const t = plainText(); return t.length > 12000 ? t.slice(0, 12000) + '\n[…]' : t; }
const FORMAT = `Format : paragraphes séparés par une ligne vide ; titres éventuels "## Titre" ; listes avec des lignes commençant par "- " ; gras avec **mot**. Toutes les mathématiques en LaTeX : $...$ dans la ligne, et $$...$$ seules sur leur propre ligne pour les formules centrées. N'utilise jamais \\[ \\] ni \\( \\), ni de balises de code.`;

/* ---------- Panneau « Écrire / Demander à Claude » ---------- */
const cp = $('#cpanel'), cpIn = $('#cp-input'), cpAns = $('#cp-answer'), cpCtx = $('#cp-ctx'), cpIdeas = $('#cp-ideas');
const cpGo = $('#cp-go'), cpStop = $('#cp-stop'), cpInsert = $('#cp-insert'), cpCopy = $('#cp-copy'), cpNew = $('#cp-new');
const IDEAS = {
  write: ['La formule de la somme des k² pour k de 0 à n', 'La démonstration de la formule du binôme de Newton', 'Un paragraphe de conclusion', 'La suite de mon texte'],
  ask: ['Explique ce passage simplement', 'Y a-t-il une erreur dans mon raisonnement ?', 'Résume mon texte en trois points', 'Quels exemples pourrais-je ajouter ?']
};
let cpMode = 'write', cpSel = '', cpRange = null, cpTurns = [], cpCtl = null, cpBusy = false, cpLast = '';

function openClaude(mode, opts = {}){
  if (window.plumeNoAI) return; // version sans IA
  closePop(); closeMath(false); hideSelbar();
  const s = getSelection();
  if (s.rangeCount && editor.contains(s.anchorNode)) saved = s.getRangeAt(0).cloneRange();
  cpRange = saved ? saved.cloneRange() : null;
  cpSel = selectedText();
  cpCtx.hidden = !cpSel;
  cpCtx.textContent = cpSel ? `À propos de : « ${cpSel.length > 240 ? cpSel.slice(0, 240) + '…' : cpSel} »` : '';
  setCpMode(mode);
  cp.hidden = false;
  cpIn.value = opts.prompt || ''; cpIn.focus();
  if (opts.send) sendClaude();
}
function closeClaude(){ cpCtl?.abort(); cp.hidden = true; restore(); }
function setCpMode(m){
  cpMode = m;
  $('#cp-title').textContent = m === 'write' ? 'Insérer du texte' : 'Demander à Claude';
  cpIn.placeholder = m === 'write'
    ? 'Que doit écrire Claude ? Ex. : la démonstration de la formule du binôme de Newton'
    : 'Ta question sur le texte. Ex. : explique-moi ce passage';
  cpIdeas.innerHTML = IDEAS[m].map(t => `<button type="button">${esc(t)}</button>`).join('');
  updateCp();
}
function updateCp(){
  const ask = cpMode === 'ask';
  cpAns.hidden = !ask || !cpAns.childElementCount;
  cpNew.hidden = !ask || !cpTurns.length || cpBusy;
  cpInsert.hidden = true; // la réponse reste dans la fenêtre, pas dans le texte
  cpCopy.hidden = !ask || !cpLast || cpBusy;
  cpStop.hidden = !cpBusy;
  cpGo.hidden = cpBusy;
  cpGo.textContent = ask ? 'Envoyer' : 'Insérer';
  cpGo.disabled = aiState !== 'ok';
  cpIdeas.hidden = ask && cpTurns.length > 0;
}
cpIdeas.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; cpIn.value = b.textContent; cpIn.focus(); });
// Le champ grandit avec le texte, comme dans Messages.
function growCp(){ cpIn.style.height = 'auto'; cpIn.style.height = Math.min(cpIn.scrollHeight, innerHeight * 0.3) + 'px'; }
cpIn.addEventListener('input', growCp);
cpIn.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendClaude(); }
  if (e.key === 'Escape') { e.preventDefault(); closeClaude(); }
});
$('#cp-close').addEventListener('click', closeClaude);
cpGo.addEventListener('click', sendClaude);
cpStop.addEventListener('click', () => cpCtl?.abort());
cpNew.addEventListener('click', () => { cpTurns = []; cpLast = ''; cpAns.replaceChildren(); updateCp(); cpIn.focus(); });
cpCopy.addEventListener('click', () => copy(cpLast));
cpInsert.addEventListener('click', () => {
  if (!cpLast) return;
  const b = makeBlock(); fillHTML(b.querySelector('.ai-body'), cpLast, true); b.classList.remove('writing');
  placeBlock(b, cpRange); cp.hidden = true; changed(); updateDock();
});

function sendClaude(){
  const q = cpIn.value.trim();
  if (!q || cpBusy) return;
  if (!sampleFn || aiState !== 'ok') { toast("Claude n'est pas disponible ici."); return; }
  if (cpMode === 'write') { cp.hidden = true; writeInDoc(q, cpSel, cpRange); return; }
  askClaude(q);
}

async function askClaude(q){
  const rules = `Tu es Claude, intégré à Plume, un éditeur de texte. L'utilisateur te pose des questions sur son document. Réponds dans la langue de la question, clairement et brièvement, en le tutoyant. Quand tu t'appuies sur le document, cite le passage entre guillemets. ${FORMAT}

Document de l'utilisateur :
<<<
${docContext()}
>>>` + (cpSel ? `\n\nPassage qu'il a sélectionné :\n<<<\n${cpSel}\n>>>` : '');
  cpTurns.push({ role: 'user', content: q });
  if (cpTurns.length > 12) cpTurns = cpTurns.slice(-12);
  while (cpTurns[0] && cpTurns[0].role !== 'user') cpTurns.shift();
  const qEl = document.createElement('div'); qEl.className = 'q'; qEl.textContent = q;
  const aEl = document.createElement('div'); aEl.className = 'a'; aEl.innerHTML = '<span class="wait">Claude réfléchit…</span>';
  cpAns.append(qEl, aEl); cpIn.value = '';
  cpBusy = true; cpLast = ''; cpCtl = new AbortController(); updateCp();
  aEl.scrollIntoView({ block: 'nearest' });
  try {
    const { text } = await sampleFn([{ role: 'user', content: rules }, ...cpTurns], {
      signal: cpCtl.signal, cache: false,
      onText: ({ text }) => { fillHTML(aEl, text, false); cpAns.scrollTop = cpAns.scrollHeight; }
    });
    fillHTML(aEl, text, true); cpLast = text;
    cpTurns.push({ role: 'assistant', content: text });
  } catch (e) {
    cpTurns.pop();
    if (e && e.text) { fillHTML(aEl, e.text, true); cpLast = e.text; }
    const n = document.createElement('p'); n.className = 'wait'; n.textContent = aiError(e, 'Réponse');
    if (!e || !e.text) aEl.replaceChildren(n); else aEl.append(n);
    aiOff(e);
  } finally {
    cpBusy = false; updateCp(); cpIn.focus();
  }
}

/* Claude écrit directement dans le document, dans un bloc à garder ou retirer. */
function makeBlock(){
  const b = document.createElement('div');
  b.className = 'ai-block writing'; b.contentEditable = 'false'; b.dataset.id = String(++sgId);
  b.title = 'Cliquer pour garder ou retirer';
  b.innerHTML = '<span class="ai-tag">✦ Écrit par Claude · clique pour garder ou retirer</span><div class="ai-body"></div>';
  return b;
}
function placeBlock(block, range){
  let top = null;
  if (range && editor.contains(range.endContainer) && range.endContainer !== editor) {
    top = range.endContainer.nodeType === 1 ? range.endContainer : range.endContainer.parentElement;
    while (top && top.parentElement !== editor) top = top.parentElement;
  } else if (range && range.endContainer === editor) top = editor.children[Math.max(0, range.endOffset - 1)] || null;
  if (top && top.parentElement === editor) {
    const empty = !top.textContent.replace(/[​\s]/g, '') && !top.querySelector('.math') && /^(P|DIV)$/.test(top.tagName);
    empty ? top.replaceWith(block) : top.after(block);
  } else editor.append(block);
  block.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
async function writeInDoc(q, sel, range){
  if (aiBusy) { toast('Claude travaille déjà. Attends la fin ou arrête-le.'); return; }
  const block = makeBlock(), body = block.querySelector('.ai-body');
  placeBlock(block, range);
  aiCtl = new AbortController(); aiBusy = true; dockMsg = 'Claude écrit dans ton texte…'; updateDock();
  const prompt = `Tu es Claude, intégré à Plume, un éditeur de texte. Tu écris directement dans le document de l'utilisateur, à l'endroit de son curseur.

Sa demande : ${q}
${sel ? `\nPassage qu'il a sélectionné (la demande peut s'y rapporter) :\n<<<\n${sel}\n>>>\n` : ''}
Son document, pour le contexte, le ton et la cohérence (ne le recopie pas) :
<<<
${docContext()}
>>>

Réponds UNIQUEMENT avec le texte à insérer, sans introduction ni commentaire. Une démonstration alterne phrases courtes et formules centrées. Écris dans la langue de la demande. ${FORMAT}`;
  try {
    const { text } = await sampleFn(prompt, { signal: aiCtl.signal, cache: false, onText: ({ text }) => fillHTML(body, text, false) });
    fillHTML(body, text, true); dockMsg = '';
  } catch (e) {
    if (e && e.text) fillHTML(body, e.text, true); else block.remove();
    dockMsg = aiError(e, 'Écriture'); aiOff(e);
  } finally {
    block.classList.remove('writing');
    if (block.isConnected && !body.textContent.trim() && !body.querySelector('.math')) block.remove();
    aiBusy = false; updateDock();
  }
}

/* Reformuler la sélection : la proposition arrive dans le texte, en couleurs chaudes. */
async function reformulate(){
  const r = saved && !saved.collapsed && editor.contains(saved.commonAncestorContainer) ? saved.cloneRange() : null;
  if (!r || !sampleFn || aiState !== 'ok') return;
  if (aiBusy) { toast('Claude travaille déjà. Attends la fin ou arrête-le.'); return; }
  if (blockOf(r.startContainer) !== blockOf(r.endContainer) || r.cloneContents().querySelector('.ai-sg,.ai-block,.math')) {
    dockMsg = 'Sélectionne un passage dans un seul paragraphe, sans formule ni proposition de Claude.'; updateDock(); return;
  }
  const txt = r.toString().replace(/​/g, '').trim(); if (!txt) return;
  const para = (blockOf(r.startContainer)?.textContent || '').replace(/​/g, '').slice(0, 3000);
  aiCtl = new AbortController(); aiBusy = true; dockMsg = 'Claude reformule…'; updateDock();
  try {
    const res = await sampleFn.json(`Reformule ce passage pour le rendre plus clair et plus fluide, en gardant le sens, le ton, le niveau de langue et la langue.

Paragraphe où il se trouve (contexte) :
<<<
${para}
>>>

Passage à reformuler :
<<<
${txt}
>>>

Réponds uniquement avec un objet JSON : {"remplacement": "le passage reformulé, prêt à remplacer l'original", "explication": "une phrase courte qui dit ce qui change, en tutoyant"}`, { signal: aiCtl.signal, cache: false });
    const rep = res && typeof res.remplacement === 'string' ? res.remplacement.trim() : '';
    if (!rep || rep === txt) dockMsg = "Claude n'a pas trouvé de meilleure formulation.";
    else {
      const range = r.startContainer.isConnected && r.toString().replace(/​/g, '').trim() === txt ? r : locate(txt);
      if (!range) dockMsg = 'Le passage a changé entre-temps. Sélectionne-le à nouveau.';
      else {
        const span = makeSg('style', String(res.explication || 'Reformulation proposée par Claude.'));
        const d = document.createElement('del'); d.append(range.extractContents());
        const i = document.createElement('ins'); i.textContent = rep;
        span.append(d, i); range.insertNode(span); markNew(span); changed(); dockMsg = '';
      }
    }
  } catch (e) {
    dockMsg = aiError(e, 'Reformulation'); aiOff(e);
  } finally { aiBusy = false; updateDock(); }
}

/* ---------- Bulle au-dessus d'une sélection ---------- */
const selbar = $('#selbar');
function hideSelbar(){ selbar.hidden = true; }
function showSelbar(){
  const s = getSelection();
  if (painter || !s.rangeCount || s.isCollapsed || !editor.contains(s.anchorNode) || !cp.hidden || !mathPanel.hidden) { hideSelbar(); return; }
  const r = s.getRangeAt(0), t = r.toString().replace(/​/g, '').trim();
  if (!t) { hideSelbar(); return; }
  $('#sb-search').href = 'https://www.google.com/search?q=' + encodeURIComponent(t.slice(0, 300));
  selbar.querySelectorAll('.needs-ai').forEach(b => { b.disabled = aiState !== 'ok'; b.title = aiState === 'ok' ? '' : "Claude fonctionne quand la page est ouverte dans Claude"; });
  selbar.hidden = false;
  const rect = r.getBoundingClientRect(), w = selbar.offsetWidth, h = selbar.offsetHeight;
  const barBottom = $('.bar').getBoundingClientRect().bottom;
  let top = rect.top - h - 8; if (top < barBottom + 4) top = rect.bottom + 8;
  selbar.style.left = Math.max(8, Math.min(rect.left + rect.width / 2 - w / 2, innerWidth - w - 8)) + 'px';
  selbar.style.top = Math.min(top, innerHeight - h - 8) + 'px';
}
document.addEventListener('mouseup', e => {
  if (!(e.target instanceof Element) || selbar.contains(e.target) || pop.contains(e.target) || e.target.closest('.bar')) return;
  setTimeout(showSelbar, 0);
});
document.addEventListener('touchend', e => { if (!selbar.contains(e.target)) setTimeout(showSelbar, 250); });
editor.addEventListener('keyup', e => { if (e.shiftKey || e.key === 'Shift') showSelbar(); });
document.addEventListener('selectionchange', () => { const s = getSelection(); if (!s.rangeCount || s.isCollapsed) hideSelbar(); });
editor.addEventListener('input', hideSelbar);
window.addEventListener('scroll', hideSelbar, { passive: true });
selbar.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
selbar.addEventListener('click', e => {
  if (e.target.closest('#sb-search')) { hideSelbar(); return; }
  const b = e.target.closest('[data-sb]'); if (!b || b.disabled) return;
  const k = b.dataset.sb; hideSelbar();
  if (k === 'copy') copy(selectedText());
  else if (k === 'ask') openClaude('ask');
  else if (k === 'reform') reformulate();
  else if (k === 'note') addNote();
});

/* ---------- Liste des propositions sur le côté (grand écran) ----------
   Même contenu que dans le texte, rangé dans l'ordre du document. */
const side = $('#ai-side'), sdList = $('#sd-list');
let sideOn = store.get('plume-side') !== '0';
function renderSide(){
  const items = [...editor.querySelectorAll('.ai-sg, .ai-block:not(.writing)')];
  const open = sideOn && !aiHidden && items.length > 0;
  side.hidden = !open; document.body.classList.toggle('side-open', open);
  if (!open) return;
  side.style.setProperty('--bar-h', $('.bar').getBoundingClientRect().bottom + 'px');
  $('#sd-title').textContent = `${plural(items.length, 'proposition')} de Claude`;
  sdList.replaceChildren(...items.map(el => {
    const c = document.createElement('article'); c.className = 'sd-card'; c.dataset.id = el.dataset.id;
    const block = el.classList.contains('ai-block'), idea = el.classList.contains('idea');
    const info = SG.get(el.dataset.id) || {};
    const type = block ? 'idee' : (TYPES[info.type] ? info.type : 'style');
    const pill = document.createElement('span'); pill.className = 'pill'; pill.dataset.t = type;
    pill.textContent = block ? 'Écrit par Claude' : TYPES[type];
    const txt = document.createElement('div'); txt.className = 'txt';
    const ins = document.createElement('ins');
    if (block) {
      ins.className = 'cool';
      const cl = el.querySelector('.ai-body').cloneNode(true);
      cl.querySelectorAll('.math').forEach(m => m.replaceWith(` ${m.dataset.tex} `));
      cl.querySelectorAll('p,h2,h3,li').forEach(x => x.append(' '));
      const t = cl.textContent.replace(/\s+/g, ' ').trim(); ins.textContent = t.length > 160 ? t.slice(0, 160) + '…' : t; txt.append(ins); }
    else if (idea) { ins.className = 'cool'; ins.textContent = el.querySelector('ins').textContent; txt.append(ins); }
    else { const d = document.createElement('del'); d.textContent = el.querySelector('del').textContent; ins.textContent = el.querySelector('ins').textContent; txt.append(d, ' → ', ins); }
    c.append(pill, txt);
    if (info.why && !idea && !block) { const w = document.createElement('p'); w.className = 'why'; w.textContent = info.why; c.append(w); }
    const acts = document.createElement('div'); acts.className = 'acts';
    acts.innerHTML = idea ? '<button class="btn" data-a="no">Retirer l\'idée</button>'
      : `<button class="btn primary" data-a="ok">${block ? 'Garder' : 'Accepter'}</button><button class="btn" data-a="no">${block ? 'Retirer' : 'Refuser'}</button>`;
    c.append(acts);
    return c;
  }));
}
function sgById(id){ return editor.querySelector(`.ai-sg[data-id="${CSS.escape(id)}"], .ai-block[data-id="${CSS.escape(id)}"]`); }
side.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
sdList.addEventListener('click', e => {
  const c = e.target.closest('.sd-card'); if (!c) return;
  const el = sgById(c.dataset.id); if (!el) { renderSide(); return; }
  const a = e.target.closest('[data-a]')?.dataset.a;
  if (a) { closePop(); resolveAny(el, a === 'ok'); return; }
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1200);
});
sdList.addEventListener('mouseover', e => {
  const c = e.target.closest('.sd-card'); const el = c && sgById(c.dataset.id);
  editor.querySelectorAll('.flash').forEach(x => { if (x !== el) x.classList.remove('flash'); });
  el?.classList.add('flash');
});
sdList.addEventListener('mouseleave', () => editor.querySelectorAll('.flash').forEach(x => x.classList.remove('flash')));
$('#sd-close').addEventListener('click', () => { sideOn = false; store.set('plume-side', '0'); updateDock(); toast('Liste fermée. Le bouton « Liste » en bas la rouvre.'); });
// Survoler une proposition dans le texte met sa carte en avant dans la liste.
editor.addEventListener('mouseover', e => {
  if (side.hidden) return;
  const el = e.target.closest('.ai-sg, .ai-block');
  sdList.querySelectorAll('.sd-card.on').forEach(c => c.classList.remove('on'));
  if (el) { const c = sdList.querySelector(`.sd-card[data-id="${CSS.escape(el.dataset.id || '')}"]`); if (c) { c.classList.add('on'); c.scrollIntoView({ block: 'nearest' }); } }
});

/* ---------- Machine à écrire : la ligne où l'on écrit reste au milieu de l'écran ---------- */
const twOn = true; // toujours actif
let twT = 0, twScrollUntil = 0;
// Position du curseur à l'écran. Safari renvoie parfois une position vide ou aberrante
// (rectangle à zéro, ou très loin hors de l'écran) : on vérifie, et on se rabat sur
// le caractère voisin puis sur le paragraphe.
function caretRect(){
  const s = getSelection(); if (!s.rangeCount || !editor.contains(s.anchorNode)) return null;
  const vH = window.visualViewport ? window.visualViewport.height : innerHeight;
  const sane = x => x && x.height > 0 && !(x.top === 0 && x.left === 0 && x.bottom === 0)
    && x.top > -vH * 1.5 && x.top < vH * 2.5;
  const r = s.getRangeAt(0).cloneRange(); r.collapse(false);
  let rect = r.getClientRects()[0];
  if (!sane(rect)) {
    const n = r.startContainer, o = r.startOffset;
    if (n.nodeType === 3 && n.length) {
      const q = document.createRange();
      if (o > 0) { q.setStart(n, o - 1); q.setEnd(n, o); } else { q.setStart(n, 0); q.setEnd(n, 1); }
      const rs = q.getClientRects(); rect = rs[rs.length - 1];
    }
  }
  if (!sane(rect)) {
    const n = s.anchorNode, el = n.nodeType === 1 ? n : n.parentElement;
    const blk = el && el.closest(BLOCKS);
    rect = blk && blk !== editor && editor.contains(blk) ? blk.getBoundingClientRect() : null;
    if (rect && rect.height > vH * 0.6) rect = null; // un long paragraphe ne dit pas où est la ligne
  }
  return sane(rect) ? rect : null;
}
// strict : centrer exactement (pendant la frappe). Sinon : ne bouger que si la ligne sort
// de la zone centrale de l'écran (déplacements aux flèches, clics), pour éviter les sauts.
function centerCaret(strict){
  if (!twOn || document.activeElement !== editor || !getSelection().isCollapsed) return;
  if (!pop.hidden || !cp.hidden || !mathPanel.hidden) return; // ne pas fermer un menu ouvert en faisant défiler
  const rect = caretRect(); if (!rect) return;
  const vv = window.visualViewport, vTop = vv ? vv.offsetTop : 0, vH = vv ? vv.height : innerHeight;
  const top = Math.max($('.bar').getBoundingClientRect().bottom, vTop);
  const area = vTop + vH - top, y = rect.top + rect.height / 2;
  const target = top + area * 0.45;
  if (!strict && y > top + area * 0.25 && y < top + area * 0.65) return;
  let d = y - target;
  if (Math.abs(d) <= 3) return;
  d = Math.max(-vH * 0.9, Math.min(vH * 0.9, d)); // jamais plus d'un écran d'un coup
  twScrollUntil = Date.now() + 400;
  window.scrollTo(0, Math.max(0, window.scrollY + d));
}
// Après un déplacement, on recentre une deuxième fois quand le mode concentration a fini d'agrandir le paragraphe.
function centerSoon(){ clearTimeout(twT); requestAnimationFrame(() => centerCaret(false)); twT = setTimeout(() => centerCaret(false), 290); }
editor.addEventListener('input', () => requestAnimationFrame(() => centerCaret(true)));
editor.addEventListener('keyup', e => { if (/^(Arrow|Page|Home|End|Enter|Backspace|Delete)/.test(e.key)) centerSoon(); });
editor.addEventListener('mouseup', () => setTimeout(centerSoon, 0));
// Sur écran tactile : on recentre après un simple toucher, jamais après un glissement du doigt
// (sinon la page revient vers le curseur dès qu'on lâche l'écran en faisant défiler).
let touchStart = null;
editor.addEventListener('touchstart', e => { const t = e.touches[0]; touchStart = t ? { x: t.clientX, y: t.clientY, y0: window.scrollY, at: Date.now() } : null; }, { passive: true });
editor.addEventListener('touchend', e => {
  const t = e.changedTouches[0], st = touchStart; touchStart = null;
  if (!st || !t) return;
  const moved = Math.abs(t.clientX - st.x) > 10 || Math.abs(t.clientY - st.y) > 10 || Math.abs(window.scrollY - st.y0) > 10;
  if (!moved && Date.now() - st.at < 600) setTimeout(centerSoon, 350);
}, { passive: true });
editor.addEventListener('focus', () => setTimeout(centerSoon, 0));
// Ouverture ou fermeture du clavier : seulement quand la hauteur visible change franchement,
// pas pour les petites variations de la barre de Safari pendant le défilement.
let vvH = window.visualViewport ? window.visualViewport.height : 0;
window.visualViewport?.addEventListener('resize', () => {
  const h = window.visualViewport.height;
  if (Math.abs(h - vvH) > 120) centerSoon();
  vvH = h;
});
function applyTw(){ document.body.classList.add('tw'); }

/* ---------- Sections repliables (titres 1, 2, 3) ----------
   Un titre replié porte data-fold="1" (enregistré avec le document). Tout ce qui le suit
   est caché jusqu'au prochain titre de même niveau ou de niveau supérieur. */
function refold(){
  const s = getSelection(), caret = s.rangeCount ? s.anchorNode : null;
  let hideLevel = 0, hider = null, again = false;
  for (const el of editor.children) {
    const m = /^H([123])$/.exec(el.tagName), lvl = m ? +m[1] : 0;
    if (hideLevel && lvl && lvl <= hideLevel) { hideLevel = 0; hider = null; }
    let hidden = !!hideLevel;
    // Ne jamais cacher l'endroit où l'on écrit, ni une proposition de Claude : on rouvre la section.
    if (hidden && hider && ((caret && el.contains(caret)) || el.matches('.ai-block') || el.querySelector('.ai-sg,.ai-block'))) {
      delete hider.dataset.fold; again = true; break;
    }
    if (el.classList.contains('fold-hidden') !== hidden) {
      el.classList.toggle('fold-hidden', hidden);
      if (!el.classList.length) el.removeAttribute('class');
    }
    if (!hidden && lvl && el.dataset.fold === '1') { hideLevel = lvl; hider = el; }
  }
  if (again) refold();
}
function toggleFold(h){
  if (h.dataset.fold === '1') delete h.dataset.fold; else h.dataset.fold = '1';
  // Si le curseur était dans la partie qui se replie, il remonte à la fin du titre.
  const s = getSelection();
  if (h.dataset.fold === '1' && s.rangeCount && editor.contains(s.anchorNode) && !h.contains(s.anchorNode)) {
    const n = s.anchorNode, after = h.compareDocumentPosition(n) & Node.DOCUMENT_POSITION_FOLLOWING;
    if (after) { const r = document.createRange(); r.selectNodeContents(h); r.collapse(false); setRange(r); }
  }
  refold(); changed();
}
function foldAll(fold){
  editor.querySelectorAll(':scope > :is(h1,h2,h3)').forEach(h => { if (fold) h.dataset.fold = '1'; else delete h.dataset.fold; });
  if (fold) { const first = editor.querySelector(':scope > :is(h1,h2,h3)'); if (first) { const r = document.createRange(); r.selectNodeContents(first); r.collapse(false); setRange(r); } }
  refold(); changed();
}
// La flèche est dessinée à gauche du titre : un clic à gauche du texte du titre la déclenche.
editor.addEventListener('mousedown', e => {
  const h = e.target instanceof Element && e.target.closest('h1,h2,h3');
  if (!h || h.parentElement !== editor) return;
  const left = h.getBoundingClientRect().left + parseFloat(getComputedStyle(h).paddingLeft || 0);
  if (e.clientX >= left - 2) return;
  e.preventDefault(); toggleFold(h);
});

/* ---------- Barre d'outils : toujours en haut, masquable ----------
   Sur iPad, quand le clavier est ouvert, Safari fait glisser la page sous l'écran : on recale
   la barre sur la partie visible pour qu'elle ne disparaisse jamais en défilant. */
const barEl = $('.bar'), barToggle = $('#bar-toggle');
function syncBarHeight(){ document.documentElement.style.setProperty('--bar-h', barEl.offsetHeight + 'px'); }
new ResizeObserver(syncBarHeight).observe(barEl);
function placeBar(){
  // On ne recale la barre que lorsque le clavier occupe vraiment l'écran : pendant l'effet
  // d'élastique en bout de document, Safari fait aussi varier offsetTop, et la barre suivait.
  const vv = window.visualViewport;
  const keyboard = vv && innerHeight - vv.height > 120;
  const off = keyboard ? Math.max(0, Math.min(vv.offsetTop, innerHeight - vv.height)) : 0;
  barEl.style.transform = off ? `translateY(${off}px)` : '';
  document.documentElement.style.setProperty('--vv-top', off + 'px');
}
window.visualViewport?.addEventListener('scroll', placeBar);
window.visualViewport?.addEventListener('resize', placeBar);
function setBarHidden(h){
  document.body.classList.toggle('bar-hidden', h);
  store.set('plume-bar-hidden', h ? '1' : '0');
  const label = h ? "Afficher la barre d'outils" : "Masquer la barre d'outils";
  barToggle.title = label; barToggle.setAttribute('aria-label', label);
  if (h) closePop();
  syncBarHeight();
}
barToggle.addEventListener('mousedown', e => e.preventDefault()); // garder le curseur dans le texte
barToggle.addEventListener('click', () => setBarHidden(!document.body.classList.contains('bar-hidden')));

/* ---------- Copier le style (pinceau) ----------
   1. Le curseur dans un texte mis en forme, appuyer sur le pinceau : le style est copié.
   2. Sélectionner un autre texte : il prend ce style (couleur, surlignage, soulignement,
      police, taille, gras, italique, barré). Échap ou un nouvel appui annule. */
let painter = null;
const paintBtn = $('#paint-btn');
function copyStyle(){
  const el = anchorEl(); if (!el) { toast('Place d\'abord le curseur dans le texte dont tu veux copier le style.'); return; }
  const st = { cmd: {} };
  for (const cat of ['c','h','u','f','s']) {
    const n = el.closest(`[data-${cat}]`);
    st[cat] = n && editor.contains(n) ? n.getAttribute(`data-${cat}`) : null;
    if (cat === 'c' && st.c === 'perso') st.cExtra = { light: n.style.getPropertyValue('--cl').trim(), dark: n.style.getPropertyValue('--cd').trim() };
  }
  for (const c of ['bold','italic','strikeThrough','subscript','superscript']) { try { st.cmd[c] = document.queryCommandState(c); } catch(e) { st.cmd[c] = false; } }
  painter = st;
  // La sélection d'origine ne doit pas recevoir le style tout de suite : on la referme.
  const s = getSelection(); if (s.rangeCount && !s.isCollapsed) { const r = s.getRangeAt(0).cloneRange(); r.collapse(false); setRange(r); }
  document.body.classList.add('painting'); paintBtn.setAttribute('aria-pressed', 'true');
  toast('Style copié. Sélectionne le texte à mettre en forme.');
}
function stopPainting(){ painter = null; document.body.classList.remove('painting'); paintBtn.setAttribute('aria-pressed', 'false'); }
function pasteStyle(){
  const st = painter; stopPainting();
  const s = getSelection(); if (!s.rangeCount || s.isCollapsed || !editor.contains(s.anchorNode)) return;
  saved = s.getRangeAt(0).cloneRange();
  for (const cat of ['c','h','u','f','s']) applyProp(cat, st[cat], cat === 'c' ? st.cExtra : undefined);
  restore();
  for (const c of ['bold','italic','strikeThrough','subscript','superscript']) {
    let on = false; try { on = document.queryCommandState(c); } catch(e) {}
    if (on !== st.cmd[c]) document.execCommand(c);
  }
  hideSelbar(); changed(); queueToolbar();
  toast('Style appliqué');
}
paintBtn.addEventListener('click', () => painter ? stopPainting() : copyStyle());
// La sélection est terminée (souris lâchée, doigt levé, Maj relâchée) : on applique le style copié.
function maybePaint(){ if (!painter) return; const s = getSelection(); if (s.rangeCount && !s.isCollapsed && editor.contains(s.anchorNode)) pasteStyle(); }
document.addEventListener('mouseup', () => setTimeout(maybePaint, 0));
document.addEventListener('touchend', () => setTimeout(maybePaint, 300));
editor.addEventListener('keyup', e => { if (e.key === 'Shift') maybePaint(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && painter) stopPainting(); });

/* ---------- Notes (commentaires) ----------
   Une note est un <span data-n="id" data-nt="texte de la note"> autour du passage commenté :
   elle suit le texte quand on le déplace, et s'enregistre avec le document. */
const notesSide = $('#notes-side'), ntList = $('#nt-list'), notesBtn = $('#notes-btn');
const noteSpans = id => [...editor.querySelectorAll(`[data-n="${CSS.escape(id)}"]`)];
function noteIds(){ const ids = []; editor.querySelectorAll('[data-n]').forEach(e => { if (!ids.includes(e.dataset.n)) ids.push(e.dataset.n); }); return ids; }
function noteText(id){ const s = noteSpans(id).find(e => e.dataset.nt); return s ? s.dataset.nt : ''; }
function updateNotesCount(){ const n = noteIds().length; $('#notes-count').textContent = n || ''; }
function addNote(){
  const s = getSelection();
  if (!s.rangeCount || s.isCollapsed || !editor.contains(s.anchorNode)) { toast('Sélectionne d\'abord le passage à commenter.'); return; }
  saved = s.getRangeAt(0).cloneRange();
  const id = 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  applyProp('n', id);
  noteSpans(id).forEach(e => e.setAttribute('data-nt', ''));
  if (!noteSpans(id).length) return;
  hideSelbar(); openNotes(id, true); changed();
}
function deleteNote(id){
  noteSpans(id).forEach(e => { e.removeAttribute('data-nt'); e.classList.remove('on'); if (!e.classList.length) e.removeAttribute('class'); clearProp(e, 'n'); });
  editor.normalize(); renderNotes(); changed();
}
function setNoteText(id, text){ noteSpans(id).forEach((e, i) => e.setAttribute('data-nt', i === 0 ? text : '')); changed(true); }
function renderNotes(){
  updateNotesCount();
  if (notesSide.hidden) return;
  const ids = noteIds();
  $('#nt-title').textContent = ids.length ? `Notes · ${ids.length}` : 'Notes';
  if (!ids.length) { ntList.innerHTML = '<p class="nt-empty">Aucune note pour l\'instant. Sélectionne un passage, puis « Commenter » dans la bulle qui apparaît (ou Ctrl+Alt+M).</p>'; return; }
  ntList.replaceChildren(...ids.map(id => {
    const c = document.createElement('article'); c.className = 'nt-card'; c.dataset.id = id;
    const q = document.createElement('p'); q.className = 'nt-quote';
    const t = noteSpans(id).map(e => e.textContent).join(' ').replace(/​/g, '').trim();
    q.textContent = '« ' + (t.length > 140 ? t.slice(0, 140) + '…' : t) + ' »';
    const ta = document.createElement('textarea'); ta.className = 'nt-text'; ta.rows = 1; ta.placeholder = 'Écris ta note…';
    ta.value = noteText(id); ta.setAttribute('aria-label', 'Note sur « ' + t.slice(0, 40) + ' »');
    const acts = document.createElement('div'); acts.className = 'nt-acts';
    acts.innerHTML = '<button class="btn" data-a="del">Supprimer la note</button>';
    c.append(q, ta, acts);
    return c;
  }));
  ntList.querySelectorAll('.nt-text').forEach(growNote);
}
function growNote(ta){ ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
function highlightNote(id){
  editor.querySelectorAll('[data-n].on').forEach(e => e.classList.remove('on'));
  ntList.querySelectorAll('.nt-card.on').forEach(c => c.classList.remove('on'));
  if (!id) return;
  noteSpans(id).forEach(e => e.classList.add('on'));
  const c = ntList.querySelector(`.nt-card[data-id="${CSS.escape(id)}"]`);
  if (c) { c.classList.add('on'); c.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}
function openNotes(id, focus){
  notesSide.hidden = false; document.body.classList.add('notes-open'); notesBtn.setAttribute('aria-pressed', 'true');
  renderNotes();
  if (id) { highlightNote(id); if (focus) ntList.querySelector(`.nt-card[data-id="${CSS.escape(id)}"] .nt-text`)?.focus(); }
}
function closeNotes(){
  notesSide.hidden = true; document.body.classList.remove('notes-open'); notesBtn.setAttribute('aria-pressed', 'false');
  highlightNote(null);
}
notesBtn.addEventListener('click', () => notesSide.hidden ? openNotes() : closeNotes());
$('#nt-close').addEventListener('click', closeNotes);
ntList.addEventListener('input', e => {
  const ta = e.target.closest('.nt-text'); if (!ta) return;
  growNote(ta); setNoteText(ta.closest('.nt-card').dataset.id, ta.value);
});
// Une note laissée vide est retirée quand on la quitte.
ntList.addEventListener('focusout', e => {
  const ta = e.target.closest('.nt-text'); if (!ta) return;
  const id = ta.closest('.nt-card').dataset.id;
  setTimeout(() => { if (!ta.value.trim() && document.activeElement !== ta && noteSpans(id).length) deleteNote(id); }, 150);
});
ntList.addEventListener('click', e => {
  const c = e.target.closest('.nt-card'); if (!c) return;
  const id = c.dataset.id;
  if (e.target.closest('[data-a="del"]')) { deleteNote(id); return; }
  highlightNote(id);
  if (!e.target.closest('.nt-text')) noteSpans(id)[0]?.scrollIntoView({ block: 'center', behavior: 'smooth' });
});
// Toucher un passage commenté : sa note apparaît dans le panneau.
editor.addEventListener('click', e => {
  const n = e.target instanceof Element && e.target.closest('[data-n]');
  if (!n || !editor.contains(n)) return;
  openNotes(n.dataset.n, false);
});
let ntT = 0;
editor.addEventListener('input', () => { clearTimeout(ntT); ntT = setTimeout(() => { updateNotesCount(); if (!notesSide.hidden && !notesSide.contains(document.activeElement)) renderNotes(); }, 400); });

/* ---------- Mode concentration ---------- */
let focusOn = store.get('plume-focus') !== '0';
function markCurrent(){
  const el = anchorEl(); if (!el) return;
  const b = el.closest(BLOCKS);
  const cur = b && editor.contains(b) ? b : null;

// Retrouve un passage dans le texte, même s'il traverse plusieurs mises en forme.
const normCh = c => (c === '’' || c === '‘') ? "'" : (c === ' ' || c === ' ') ? ' ' : (c === '“' || c === '”') ? '"' : c;
function locate(q){
  const w = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest('.math,.ai-sg') ? 2 : 1 });
  const chars = [], map = [];
  while (w.nextNode()) {
    const n = w.currentNode;
    for (let i = 0; i < n.data.length; i++) { const ch = n.data[i]; if (ch === '​') continue; chars.push(normCh(ch)); map.push([n, i]); }
  }
  const s = chars.join(''), nq = [...q.replace(/​/g, '')].map(normCh).join('');
  const k = nq ? s.indexOf(nq) : -1; if (k < 0) return null;
  const a = map[k], b = map[k + nq.length - 1], r = document.createRange();
  r.setStart(a[0], a[1]); r.setEnd(b[0], b[1] + 1); return r;
}

  activeId = id; store.set('plume-active', id);

function closeDoc(id){
  const i = docs.findIndex(d => d.id === id); if (i < 0) return;
  if (id === activeId) save();
  // Un onglet fermé part dans une petite corbeille (les 10 derniers), pour pouvoir le rouvrir.
  try {
    const trash = JSON.parse(store.get('plume-trash') || '[]');
    trash.unshift({ title: docs[i].title, html: store.get('plume-doc:' + id) || '' });
    store.set('plume-trash', JSON.stringify(trash.slice(0, 10)));
  } catch(e) {}
  try { localStorage.removeItem('plume-doc:' + id); } catch(e) {}
  docs.splice(i, 1);
  if (!docs.length) { activeId = null; newDoc(); }
  else { saveDocs(); if (id === activeId) { activeId = null; openDoc(docs[Math.min(i, docs.length - 1)].id); } else renderTabs(); }

}

  let trash = []; try { trash = JSON.parse(store.get('plume-trash') || '[]'); } catch(e) {}
  const d = trash.shift(); if (!d) { toast('Aucun onglet fermé à rouvrir.'); return; }

      const max = $('.page').clientWidth - 2 * 56;
      const w = Math.round(Math.max(320, Math.min(max, 2 * Math.abs(ev.clientX - cx))));

/* ---------- Fichiers : choisir, livrer ---------- */
function pickFile(accept, cb){

// sur iPhone et iPad (« Enregistrer dans Fichiers »), téléchargement ailleurs.
async function deliver(files){
  if (dlApi) {
    let n = 0;
    for (const f of files) {
      try { await dlApi.save({ filename: f.name, data: f }); n++; }
      catch (e) {
        if (e && e.code === 'declined') return;
        toast(e && e.code === 'rate_limited' ? 'Une fenêtre d\'enregistrement est déjà ouverte.' : "L'enregistrement de fichiers n'est pas disponible ici."); return;
      }
    }
    if (n) toast(n > 1 ? `${n} fichiers enregistrés` : `« ${files[0].name} » enregistré`);
    return;
  }
  if (navigator.canShare && navigator.share) {
    let can = false; try { can = navigator.canShare({ files }); } catch(e) {}
    if (can) {
      try { await navigator.share({ files }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
  }
  try {
    for (const f of files) {
      const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name;
      document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      if (files.length > 1) await new Promise(r => setTimeout(r, 300));
    }
    toast(files.length > 1 ? `${files.length} fichiers enregistrés dans Téléchargements` : `« ${files[0].name} » enregistré dans Téléchargements`);
  } catch(e) { toast("L'enregistrement de fichiers n'est pas autorisé ici."); }
}

function exportPDF(){

  const root = document.documentElement, prevTheme = root.getAttribute('data-theme');

}

      + `<w:style w:type="paragraph" w:styleId="ListParagraph"><w:name w:val="List Paragraph"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:after="60"/><w:ind w:firstLine="0"/></w:pPr></w:style>`

      + `<w:style w:type="table" w:styleId="TableGrid"><w:name w:val="Table Grid"/></w:style></w:styles>` },
    { name: 'word/numbering.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:numbering ${W}><w:abstractNum w:abstractNumId="0">${lvls('bullet')}</w:abstractNum><w:abstractNum w:abstractNumId="1">${lvls('decimal')}</w:abstractNum><w:abstractNum w:abstractNumId="2">${lvls('none')}</w:abstractNum><w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num><w:num w:numId="2"><w:abstractNumId w:val="1"/></w:num><w:num w:numId="3"><w:abstractNumId w:val="2"/></w:num></w:numbering>` },

/* ---------- Sauvegarde complète ---------- */
function exportBackup(){
  save();
  const data = { app: window.plumeStandalone ? 'World' : 'Plume', format: 1, date: new Date().toISOString(),
    docs: docs.map(d => ({ title: d.title, goal: d.goal || 0, html: store.get('plume-doc:' + d.id) || '' })) };
  const day = new Date().toISOString().slice(0, 10);
  deliver([new File([JSON.stringify(data)], `Sauvegarde ${data.app} ${day}.json`, { type: 'application/json' })]);
}
function importBackup(f){
  const rd = new FileReader();
  rd.onload = () => {
    let data; try { data = JSON.parse(rd.result); } catch(e) { toast("Ce fichier n'est pas une sauvegarde."); return; }
    const list = Array.isArray(data?.docs) ? data.docs.filter(d => d && typeof d.html === 'string') : [];
    if (!list.length) { toast('Aucun document dans cette sauvegarde.'); return; }
    let first = null, ok = true;
    for (const d of list) {
      const id = newId(); first = first || id;
      docs.push({ id, title: String(d.title || 'Sans titre').slice(0, 60), goal: +d.goal || 0, updated: Date.now() });
      ok = store.set('plume-doc:' + id, sanitize(d.html)) && ok;
    }
    saveDocs(); openDoc(first);
    toast(ok ? `${list.length} document${list.length > 1 ? 's' : ''} restauré${list.length > 1 ? 's' : ''} dans de nouveaux onglets` : "Mémoire pleine : certains documents n'ont pas pu être restaurés.");
  };
  rd.readAsText(f);
}

/* ---------- Statistiques et objectif de mots ---------- */
function docStats(text){
  const words = (text.match(/[\p{L}\p{N}][\p{L}\p{N}'’-]*/gu) || []).length;
  const chars = text.replace(/\n/g, '').length, nospace = text.replace(/\s/g, '').length;
  const sentences = (text.match(/[^.!?…]*[\p{L}\p{N}][^.!?…]*([.!?…]+|$)/gmu) || []).filter(s => /[\p{L}\p{N}]/u.test(s)).length;
  return { words, chars, nospace, sentences };
}
const minutes = (w, per) => { const m = w / per; return m < 1 ? (w ? 'moins d\'une minute' : '0 minute') : Math.round(m) + ' min'; };
function openStats(btn){
  const text = plainText(), st = docStats(text), paras = editor.querySelectorAll(':scope > :is(p,h1,h2,h3,blockquote,pre), li').length;
  const sel = selectedText(), ss = sel ? docStats(sel) : null, d = docs.find(x => x.id === activeId), goal = d?.goal || 0;
  const pct = goal ? Math.min(100, Math.round(st.words / goal * 100)) : 0;
  openPop(btn || statusEl, `<div class="stats">
    <div class="st-big"><b>${fmtN(st.words)}</b> mots</div>
    ${ss ? `<div class="st-sel">Sélection : ${fmtN(ss.words)} mots · ${fmtN(ss.chars)} caractères</div>` : ''}
    <dl>
      <dt>Caractères</dt><dd>${fmtN(st.chars)}</dd>
      <dt>Sans les espaces</dt><dd>${fmtN(st.nospace)}</dd>
      <dt>Phrases</dt><dd>${fmtN(st.sentences)}</dd>
      <dt>Paragraphes</dt><dd>${fmtN(paras)}</dd>
      <dt>Temps de lecture</dt><dd>${minutes(st.words, 230)}</dd>
      <dt>Temps de parole</dt><dd>${minutes(st.words, 140)}</dd>
    </dl>
    <div class="hr"></div>
    <label class="st-goal">Objectif de mots<input type="number" inputmode="numeric" min="0" step="50" id="goal-in" value="${goal || ''}" placeholder="aucun"></label>
    <div class="goalbar"${goal ? '' : ' hidden'}><i style="width:${pct}%"></i></div>
    <div class="st-pct"${goal ? '' : ' hidden'}>${pct >= 100 ? 'Objectif atteint 🎉' : `${pct} % · encore ${fmtN(Math.max(0, goal - st.words))} mots`}</div>
  </div>`, p => {
    const inp = p.querySelector('#goal-in');
    inp.addEventListener('input', () => {
      const g = Math.max(0, Math.round(+inp.value || 0));
      if (d) { d.goal = g; d.goalHit = st.words >= g && g > 0; saveDocs(); }
      const pc = g ? Math.min(100, Math.round(st.words / g * 100)) : 0;
      p.querySelector('.goalbar').hidden = p.querySelector('.st-pct').hidden = !g;
      p.querySelector('.goalbar i').style.width = pc + '%';
      p.querySelector('.st-pct').textContent = pc >= 100 ? 'Objectif atteint 🎉' : `${pc} % · encore ${fmtN(Math.max(0, g - st.words))} mots`;
      statusEl.textContent = countLabel();
    });
  });
}
statusEl.addEventListener('click', () => openStats(statusEl));

/* ---------- Plan : barre latérale à gauche, comme dans Notes ou Pages ----------
   Tous les titres, rangés (titre 1 > titre 2 > titre 3). Un toucher y emmène ; la flèche replie
   une partie du plan (sans toucher au document). La partie où se trouve le curseur est en bleu. */
const olSide = $('#outline-side'), olBody = $('#ol-body'), olBtn = $('#outline-btn');
let olOpen = false, olClosed = new Set();
const wideScreen = () => innerWidth >= 1100;
function setOutline(open, remember = true){
  olOpen = open; olSide.hidden = !open;
  document.body.classList.toggle('outline-open', open);
  olBtn.setAttribute('aria-pressed', open);
  if (remember) store.set('plume-outline', open ? '1' : '0');
  if (open) renderOutline();
}
olBtn.addEventListener('click', () => setOutline(!olOpen));
$('#ol-close').addEventListener('click', () => setOutline(false));
function renderOutline(){
  if (!olOpen) return;
  const hs = [...editor.querySelectorAll(':scope > :is(h1,h2,h3)')];
  if (!hs.length) { olBody.innerHTML = '<p class="nt-empty">Aucun titre pour l\'instant. Choisis Titre 1, 2 ou 3 dans le menu « Texte » de la barre : ils apparaîtront ici, rangés.</p>'; return; }
  const cur = anchorEl()?.closest('#editor > *');
  let curH = null;
  if (cur) for (const h of hs) { if (h === cur || (h.compareDocumentPosition(cur) & Node.DOCUMENT_POSITION_FOLLOWING)) curH = h; else break; }
  // Pour chaque titre : a-t-il des sous-titres, et l'un de ses parents est-il replié dans le plan ?
  const lv = hs.map(h => +h.tagName[1]), rows = [], stack = [];
  hs.forEach((h, i) => {
    while (stack.length && lv[stack[stack.length - 1]] >= lv[i]) stack.pop();
    const hidden = stack.some(j => olClosed.has(j));
    const kids = i + 1 < hs.length && lv[i + 1] > lv[i];
    const txt = h.textContent.replace(/​/g, '').trim() || 'Sans titre';
    if (!hidden) rows.push(`<div class="ol-row l${lv[i]}${h === curH ? ' on' : ''}" style="--d:${stack.length}">`
      + (kids ? `<button class="ol-tw${olClosed.has(i) ? ' closed' : ''}" data-t="${i}" aria-label="${olClosed.has(i) ? 'Déplier' : 'Replier'}"><svg viewBox="0 0 12 12"><path d="M3 4.5l3 3 3-3"/></svg></button>` : '<span class="ol-tw"></span>')
      + `<button class="ol-i" data-i="${i}" title="${esc(txt)}">${esc(txt)}</button></div>`);
    stack.push(i);
  });
  olBody.innerHTML = rows.join('');
  olBody.querySelector('.ol-row.on')?.scrollIntoView({ block: 'nearest' });
}
olBody.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
olBody.addEventListener('click', e => {
  const t = e.target.closest('[data-t]');
  if (t) { const k = +t.dataset.t; olClosed.has(k) ? olClosed.delete(k) : olClosed.add(k); renderOutline(); return; }
  const b = e.target.closest('[data-i]'); if (!b) return;
  const hs = [...editor.querySelectorAll(':scope > :is(h1,h2,h3)')];
  if (hs[+b.dataset.i]) goToBlock(hs[+b.dataset.i]);
  if (!wideScreen()) setOutline(false, false); // sur petit écran, le plan se range pour laisser voir le texte
});
function revealBlock(el){
  // Les sections repliées qui cachent ce bloc s'ouvrent.
  let lvl = /^H([123])$/.exec(el.tagName) ? +el.tagName[1] : 4;
  for (let p = el.previousElementSibling; p; p = p.previousElementSibling) {
    const m = /^H([123])$/.exec(p.tagName); if (!m) continue;
    if (+m[1] < lvl) { if (p.dataset.fold === '1') delete p.dataset.fold; lvl = +m[1]; }
  }
  refold();
}
function goToBlock(el){
  // Les sections repliées qui cachent ce titre s'ouvrent.
  let lvl = /^H([123])$/.exec(el.tagName) ? +el.tagName[1] : 4;
  for (let p = el.previousElementSibling; p; p = p.previousElementSibling) {
    const m = /^H([123])$/.exec(p.tagName); if (!m) continue;
    if (+m[1] < lvl) { if (p.dataset.fold === '1') delete p.dataset.fold; lvl = +m[1]; }
  }
  refold();
  const r = document.createRange(); r.selectNodeContents(el); r.collapse(false); editor.focus({ preventScroll: true }); setRange(r);
  const y = el.getBoundingClientRect().top + scrollY - innerHeight * .35;
  twScrollUntil = Date.now() + 600; window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
  markCurrent(); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 900);
}
let sideT = 0;
editor.addEventListener('input', () => { clearTimeout(sideT); sideT = setTimeout(renderOutline, 350); });
document.addEventListener('selectionchange', () => { if (olOpen) { clearTimeout(sideT); sideT = setTimeout(renderOutline, 200); } });

/* ---------- Historique des versions ----------
   Une version est gardée automatiquement toutes les 10 minutes d'écriture (25 au plus par document),
   et à la demande. Restaurer une version est réversible : Annuler la défait. */
const verKey = id => 'plume-ver:' + id;
function versions(id = activeId){ try { const v = JSON.parse(store.get(verKey(id)) || '[]'); return Array.isArray(v) ? v : []; } catch(e) { return []; } }
function storeVersions(list, id = activeId){
  while (list.length) { if (store.set(verKey(id), JSON.stringify(list))) return true; list.splice(Math.ceil(list.length / 2)); }
  return false;
}
function addVersion(force){
  if (!activeId) return;
  const html = serialize(), list = versions();
  if (list[0] && list[0].html === html) { if (force) toast('Cette version est déjà enregistrée.'); return; }
  if (!force && list[0] && Date.now() - list[0].t < 10 * 60e3) return;
  if (!html.replace(/<[^>]+>/g, '').trim() && !force) return;
  list.unshift({ t: Date.now(), html, words: docStats(plainText()).words });
  storeVersions(list.slice(0, 25));
  if (force) toast('Version enregistrée');
  if (sideKind === 'history') renderHistory();
}
function verDate(t){
  const d = new Date(t), now = new Date(), hm = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  const day = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime(), dd = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  if (dd === day) return `Aujourd'hui, ${hm}`;
  if (day - dd === 864e5) return `Hier, ${hm}`;
  return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }) + ', ' + hm;
}
function renderHistory(preview){
  spTitle.textContent = 'Versions';
  const list = versions();
  if (preview != null && list[preview]) {
    const v = list[preview];
    spBody.innerHTML = `<div class="ver-head"><button class="btn sm" data-a="back">‹ Versions</button><span>${esc(verDate(v.t))}</span></div>
      <div class="ver-prev">${sanitize(v.html)}</div>
      <div class="ver-acts"><button class="btn primary" data-a="restore">Restaurer cette version</button></div>`;
    spBody.querySelectorAll('.ver-prev .math').forEach(renderMath);
    spBody.querySelector('[data-a="back"]').onclick = () => renderHistory();
    spBody.querySelector('[data-a="restore"]').onclick = () => {
      addVersion(true);
      editor.innerHTML = sanitize(v.html); renderAllMath(); refold(); renderNotes(); changed();
      restoreToStart(); toast('Version restaurée. Annuler (Ctrl+Z) revient au texte d\'avant.');
      renderHistory();
    };
    return;
  }
  spBody.innerHTML = `<div class="ver-acts top"><button class="btn" data-a="snap">Enregistrer une version maintenant</button></div>`
    + (list.length ? `<div class="ver-list">${list.map((v, i) => `<button class="ver-i" data-i="${i}"><b>${esc(verDate(v.t))}</b><span>${fmtN(v.words || 0)} mots</span></button>`).join('')}</div>`
                   : '<p class="nt-empty">Pas encore de version. Une version est gardée automatiquement toutes les 10 minutes pendant que tu écris.</p>');
  spBody.querySelector('[data-a="snap"]').onclick = () => { save(); addVersion(true); };
  spBody.querySelectorAll('.ver-i').forEach(b => b.onclick = () => renderHistory(+b.dataset.i));
}

/* ---------- Rechercher et remplacer (et dans tous les onglets) ----------
   Les résultats sont surlignés sans toucher au texte (CSS Custom Highlight). */
const findbar = $('#findbar'), fbQ = $('#fb-q'), fbR = $('#fb-r'), fbCount = $('#fb-count'), fbRes = $('#fb-results');
const HL = typeof CSS !== 'undefined' && CSS.highlights && typeof Highlight === 'function';
let fbHits = [], fbI = -1, fbT = 0;
const BLOCK_SEL = 'p,h1,h2,h3,li,blockquote,pre,td,th,div';
// Le texte de chaque bloc, avec la position de chaque caractère dans le document.
function textBlocks(visibleOnly){
  const out = [];
  for (const b of editor.querySelectorAll(BLOCK_SEL)) {
    if (b.closest('.ai-block') || (visibleOnly && b.closest('.fold-hidden'))) continue;
    const w = document.createTreeWalker(b, NodeFilter.SHOW_TEXT, { acceptNode: n => (n.parentElement.closest(BLOCK_SEL) !== b || n.parentElement.closest('.math,.ai-sg')) ? 2 : 1 });
    let text = ''; const map = [];
    while (w.nextNode()) { const n = w.currentNode; for (let i = 0; i < n.data.length; i++) { if (n.data[i] === '​') continue; text += normCh(n.data[i]); map.push([n, i]); } }
    if (text) out.push({ b, text, map });
  }
  return out;
}
const rangeOf = (blk, k, len) => { const a = blk.map[k], z = blk.map[k + len - 1], r = document.createRange(); r.setStart(a[0], a[1]); r.setEnd(z[0], z[1] + 1); return r; };
const fold = s => s.toLowerCase();
function findAll(q, cs){
  const hits = []; if (!q) return hits;
  const nq = [...q].map(normCh).join(''), qq = cs ? nq : fold(nq);
  for (const blk of textBlocks()) {
    const t = cs ? blk.text : fold(blk.text);
    for (let k = t.indexOf(qq); k >= 0; k = t.indexOf(qq, k + Math.max(1, qq.length))) hits.push(rangeOf(blk, k, qq.length));
  }
  return hits;
}
function paintFind(){
  if (!HL) return;
  CSS.highlights.delete('find'); CSS.highlights.delete('find-cur');
  if (findbar.hidden || !fbHits.length) return;
  CSS.highlights.set('find', new Highlight(...fbHits));
  if (fbHits[fbI]) CSS.highlights.set('find-cur', new Highlight(fbHits[fbI]));
}
function runFind(keep){
  fbHits = findAll(fbQ.value, $('#fb-case').checked);
  if (!keep || fbI >= fbHits.length) fbI = fbHits.length ? 0 : -1;
  fbCount.textContent = fbQ.value ? (fbHits.length ? `${fbI + 1} sur ${fmtN(fbHits.length)}` : 'Aucun résultat') : '';
  paintFind();
  if ($('#fb-docs').checked) findInDocs(); else fbRes.hidden = true;
}
function showHit(){
  const r = fbHits[fbI]; if (!r) return;
  const top0 = blockOf(r.startContainer)?.closest('#editor > *');
  if (top0 && top0.classList.contains('fold-hidden')) { revealBlock(top0); changed(); }
  fbCount.textContent = `${fbI + 1} sur ${fmtN(fbHits.length)}`;
  paintFind();
  const rc = r.getBoundingClientRect(), top = (findbar.getBoundingClientRect().bottom || 0) + 20;
  if (rc.top < top || rc.bottom > innerHeight - 80) { twScrollUntil = Date.now() + 600; window.scrollBy({ top: rc.top - innerHeight * .4, behavior: 'smooth' }); }
  if (!HL) { setRange(r.cloneRange()); }
}
function stepFind(d){ if (!fbHits.length) return; fbI = (fbI + d + fbHits.length) % fbHits.length; showHit(); }
function openFind(){
  closePop(); hideSelbar();
  findbar.hidden = false; document.body.classList.add('finding');
  const sel = selectedText(); if (sel && sel.length < 80 && !sel.includes('\n')) fbQ.value = sel;
  fbQ.focus(); fbQ.select(); runFind(); if (fbHits.length) showHit();
}
function closeFind(){
  const r = fbHits[fbI];
  findbar.hidden = true; document.body.classList.remove('finding'); fbRes.hidden = true;
  if (HL) { CSS.highlights.delete('find'); CSS.highlights.delete('find-cur'); }
  if (r && editor.contains(r.startContainer)) { editor.focus({ preventScroll: true }); setRange(r.cloneRange()); }
}
function replaceRange(r, text){
  r.deleteContents(); const t = document.createTextNode(text); r.insertNode(t);
  const c = document.createRange(); c.setStartAfter(t); c.collapse(true); return t;
}
function replaceOne(){
  const r = fbHits[fbI]; if (!r) return;
  replaceRange(r, fbR.value); editor.normalize(); changed();
  runFind(true); if (fbHits.length) showHit();
}
function replaceAll(){
  if (!fbHits.length) return;
  const n = fbHits.length;
  for (let i = fbHits.length - 1; i >= 0; i--) replaceRange(fbHits[i], fbR.value);
  editor.normalize(); changed(); runFind();
  toast(`${fmtN(n)} remplacement${n > 1 ? 's' : ''}`);
}
// Dans tous les onglets : une liste de résultats, un clic ouvre le document au bon endroit.
function docText(html){
  const d = new DOMParser().parseFromString(`<body>${html}</body>`, 'text/html');
  d.querySelectorAll('.math').forEach(m => m.remove());
  return [...d.body.querySelectorAll(BLOCK_SEL)].filter(b => !b.querySelector(BLOCK_SEL)).map(b => [...b.textContent].map(normCh).join('').replace(/​/g, ''));
}
function findInDocs(){
  const q = fbQ.value, cs = $('#fb-case').checked;
  if (!q) { fbRes.hidden = true; return; }
  const nq = [...q].map(normCh).join(''), qq = cs ? nq : fold(nq), out = [];
  for (const d of docs) {
    const blocks = d.id === activeId ? textBlocks().map(b => b.text) : docText(store.get('plume-doc:' + d.id) || '');
    let k = 0;
    for (const text of blocks) {
      const t = cs ? text : fold(text);
      for (let i = t.indexOf(qq); i >= 0; i = t.indexOf(qq, i + Math.max(1, qq.length))) {
        const a = Math.max(0, i - 30), snip = (a ? '…' : '') + esc(text.slice(a, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length, i + q.length + 50));
        if (out.length < 80) out.push({ id: d.id, title: d.title, k, snip });
        k++;
      }
    }
  }
  fbRes.hidden = false;
  fbRes.innerHTML = out.length ? out.map((o, i) => `<button class="fb-hit" data-i="${i}"><b>${esc(o.title)}</b><span>${o.snip}</span></button>`).join('') : '<p class="fb-none">Rien dans les autres onglets.</p>';
  fbRes.querySelectorAll('.fb-hit').forEach(b => b.onclick = () => {
    const o = out[+b.dataset.i];
    if (o.id !== activeId) { openDoc(o.id); findbar.hidden = false; document.body.classList.add('finding'); }
    fbHits = findAll(fbQ.value, $('#fb-case').checked); fbI = Math.min(o.k, fbHits.length - 1);
    if (fbI >= 0) { const r = fbHits[fbI]; goToBlock(blockOf(r.startContainer)?.closest('#editor > *') || editor.firstElementChild); setTimeout(showHit, 50); }

/* ---------- Vérifier le style ----------
   Mots faibles (« vraiment », « en fait »…), répétitions proches et phrases très longues,
   soulignés sans modifier le texte. */
const WEAK = ['vraiment','très','assez','juste','en fait','du coup','donc','peut-être','plutôt','un peu','quelque chose','chose','choses','certain','certaine','certains','certaines','beaucoup','énormément','totalement','complètement','absolument','simplement','tout à fait','il y a','il y avait','faire','fait','sembler','semble','pratiquement','globalement','littéralement','basiquement','évidemment','bien sûr','actuellement'];
const STOP = new Set('alors aussi autre autres avant avec avoir cette celle celui ceux comme comment dans depuis donc elle elles encore entre être faire leur leurs mais même moins notre nous parce pendant peut plus pour quand quel quelle quelles quels sans selon sont sous tous tout toute toutes très vous votre vos ainsi après avait avaient aurait cela ceci chaque contre déjà dont fois lorsque lui leurs nous puis sera seront sinon sont tant tous trop vers voici voilà'.split(' '));
const weakRe = new RegExp(`(?<![\\p{L}\\p{N}])(${WEAK.map(w => w.replace(/ /g, '\\s+')).join('|')})(?![\\p{L}\\p{N}])`, 'giu');

function styleCheck(){
  if (!HL) { if (prefs.style) { toast("La vérification du style n'est pas disponible sur ce navigateur."); setPref('style', false); } return; }
  ['st-weak','st-rep','st-long'].forEach(n => CSS.highlights.delete(n));
  if (!prefs.style) { stylePill.hidden = true; return; }
  const weak = [], rep = [], long = [];
  for (const blk of textBlocks(true)) {
    if (blk.b.closest('pre')) continue;
    for (const m of blk.text.matchAll(weakRe)) weak.push(rangeOf(blk, m.index, m[0].length));
    // Répétitions : le même mot (5 lettres ou plus) deux fois à moins de 20 mots d'écart.
    const words = [...blk.text.matchAll(/[\p{L}][\p{L}'’-]{4,}/gu)], seen = new Map();
    words.forEach((m, i) => {
      const w = fold(m[0]).replace(/[’']/g, "'").replace(/s$/, '');
      if (STOP.has(w)) return;
      const prev = seen.get(w);
      if (prev != null && i - prev <= 20) { rep.push(rangeOf(blk, words[prev].index, words[prev][0].length), rangeOf(blk, m.index, m[0].length)); }
      seen.set(w, i);
    });
    // Phrases de plus de 35 mots
    for (const m of blk.text.matchAll(/[^.!?…]+[.!?…]*/gu)) {
      const n = (m[0].match(/[\p{L}\p{N}]+/gu) || []).length;
      if (n > 35) { const lead = m[0].match(/^\s*/)[0].length; long.push(rangeOf(blk, m.index + lead, m[0].length - lead)); }
    }

  const nr = rep.length / 2;
  stylePill.hidden = false;
  stylePill.querySelector('.sp-txt').innerHTML = (weak.length || rep.length || long.length)
    ? `<span class="k weak"></span>${weak.length} mot${weak.length > 1 ? 's' : ''} faible${weak.length > 1 ? 's' : ''}<span class="k rep"></span>${nr} répétition${nr > 1 ? 's' : ''}<span class="k long"></span>${long.length} phrase${long.length > 1 ? 's' : ''} longue${long.length > 1 ? 's' : ''}`

}

  const lvl = +prefs.focusLevel || 4, scope = prefs.focusScope === 'phrase' ? 'phrase' : 'para';
  openPop(btn, `
    <label class="mi mi-switch">Mode concentration<input type="checkbox" class="switch" id="fc-on"${focusOn ? ' checked' : ''}></label>
    <div class="hr"></div>
    <div class="mh">Garder net</div>
    <div class="chips" data-k="scope">
      <button class="mi" data-v="para" aria-checked="${scope === 'para'}">Le paragraphe</button>
      <button class="mi" data-v="phrase" aria-checked="${scope === 'phrase'}">La phrase</button>
    </div>
    <div class="mh">Atténuation du reste</div>
    <div class="dimrow">
      <input type="range" class="dim-range" id="fc-lvl" min="1" max="5" step="1" value="${lvl}" aria-label="Niveau d'atténuation, de 1 à 5">
      <div class="dim-ticks">${[1,2,3,4,5].map(n => `<span data-n="${n}"${n === lvl ? ' class="on"' : ''}>${n}</span>`).join('')}</div>
    </div>`, p => {
    p.querySelector('#fc-on').onchange = e => setFocusOn(e.target.checked);
    p.querySelector('[data-k="scope"]').onclick = e => {
      const b = e.target.closest('[data-v]'); if (!b) return;
      p.querySelectorAll('[data-k="scope"] [data-v]').forEach(x => x.setAttribute('aria-checked', x === b));
      setPref('focusScope', b.dataset.v); if (!focusOn) { setFocusOn(true); p.querySelector('#fc-on').checked = true; } sentenceDim();
    };
    const rg = p.querySelector('#fc-lvl');
    const upd = () => { setPref('focusLevel', +rg.value); applyDim(); p.querySelectorAll('.dim-ticks span').forEach(x => x.classList.toggle('on', +x.dataset.n === +rg.value)); if (!focusOn) { setFocusOn(true); p.querySelector('#fc-on').checked = true; } };
    rg.oninput = upd;
    p.querySelectorAll('.dim-ticks span').forEach(x => x.onclick = () => { rg.value = x.dataset.n; upd(); });
  });
}
