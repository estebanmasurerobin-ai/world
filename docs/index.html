/* ---------- Machine à écrire : la ligne où l'on écrit reste au milieu de l'écran ---------- */
const twOn = true; // toujours actif
let twT = 0, twScrollUntil = 0;
// Position du curseur à l'écran. Safari renvoie parfois une position vide ou aberrante
// (rectangle à zéro, ou très loin hors de l'écran) : on vérifie, et on se rabat sur
// le caractère voisin puis sur le paragraphe.
function caretRect(){
  const s = getSelection(); if (!s.rangeCount || !editor.contains(s.anchorNode)) return null;
  const vH = window.visualViewport ? window.visualViewport.height : innerHeight;
  const sane = x => x && x.height > 0 && !(x.top === 0 && x.left === 0 && x.bottom === 0)
    && x.top > -vH * 1.5 && x.top < vH * 2.5;
  const r = s.getRangeAt(0).cloneRange(); r.collapse(false);
  let rect = r.getClientRects()[0];
  if (!sane(rect)) {
    const n = r.startContainer, o = r.startOffset;
    if (n.nodeType === 3 && n.length) {
      const q = document.createRange();
      if (o > 0) { q.setStart(n, o - 1); q.setEnd(n, o); } else { q.setStart(n, 0); q.setEnd(n, 1); }
      const rs = q.getClientRects(); rect = rs[rs.length - 1];
    }
  }
  if (!sane(rect)) {
    const n = s.anchorNode, el = n.nodeType === 1 ? n : n.parentElement;
    const blk = el && el.closest(BLOCKS);
    rect = blk && blk !== editor && editor.contains(blk) ? blk.getBoundingClientRect() : null;
    if (rect && rect.height > vH * 0.6) rect = null; // un long paragraphe ne dit pas où est la ligne
  }
  return sane(rect) ? rect : null;
}
// strict : centrer exactement (pendant la frappe). Sinon : ne bouger que si la ligne sort
// de la zone centrale de l'écran (déplacements aux flèches, clics), pour éviter les sauts.
function centerCaret(strict){
  if (!twOn || document.activeElement !== editor || !getSelection().isCollapsed) return;
  if (!pop.hidden || !cp.hidden || !mathPanel.hidden) return; // ne pas fermer un menu ouvert en faisant défiler
  const rect = caretRect(); if (!rect) return;
  const vv = window.visualViewport, vTop = vv ? vv.offsetTop : 0, vH = vv ? vv.height : innerHeight;
  const top = Math.max($('.bar').getBoundingClientRect().bottom, vTop);
  const area = vTop + vH - top, y = rect.top + rect.height / 2;
  const target = top + area * 0.45;
  if (!strict && y > top + area * 0.25 && y < top + area * 0.65) return;
  let d = y - target;
  if (Math.abs(d) <= 3) return;
  d = Math.max(-vH * 0.9, Math.min(vH * 0.9, d)); // jamais plus d'un écran d'un coup
  twScrollUntil = Date.now() + 400;
  window.scrollTo(0, Math.max(0, window.scrollY + d));
}
// Après un déplacement, on recentre une deuxième fois quand le mode concentration a fini d'agrandir le paragraphe.
function centerSoon(){ clearTimeout(twT); requestAnimationFrame(() => centerCaret(false)); twT = setTimeout(() => centerCaret(false), 290); }
editor.addEventListener('input', () => requestAnimationFrame(() => centerCaret(true)));
editor.addEventListener('keyup', e => { if (/^(Arrow|Page|Home|End|Enter|Backspace|Delete)/.test(e.key)) centerSoon(); });
editor.addEventListener('mouseup', () => setTimeout(centerSoon, 0));
// Sur écran tactile : on recentre après un simple toucher, jamais après un glissement du doigt
// (sinon la page revient vers le curseur dès qu'on lâche l'écran en faisant défiler).
let touchStart = null;
editor.addEventListener('touchstart', e => { const t = e.touches[0]; touchStart = t ? { x: t.clientX, y: t.clientY, y0: window.scrollY, at: Date.now() } : null; }, { passive: true });
editor.addEventListener('touchend', e => {
  const t = e.changedTouches[0], st = touchStart; touchStart = null;
  if (!st || !t) return;
  const moved = Math.abs(t.clientX - st.x) > 10 || Math.abs(t.clientY - st.y) > 10 || Math.abs(window.scrollY - st.y0) > 10;
  if (!moved && Date.now() - st.at < 600) setTimeout(centerSoon, 350);
}, { passive: true });
editor.addEventListener('focus', () => setTimeout(centerSoon, 0));
// Ouverture ou fermeture du clavier : seulement quand la hauteur visible change franchement,
// pas pour les petites variations de la barre de Safari pendant le défilement.
let vvH = window.visualViewport ? window.visualViewport.height : 0;
window.visualViewport?.addEventListener('resize', () => {
  const h = window.visualViewport.height;
  if (Math.abs(h - vvH) > 120) centerSoon();
  vvH = h;
});
function applyTw(){ document.body.classList.add('tw'); }

/* ---------- Sections repliables (titres 1, 2, 3) ----------
   Un titre replié porte data-fold="1" (enregistré avec le document). Tout ce qui le suit
   est caché jusqu'au prochain titre de même niveau ou de niveau supérieur. */
function refold(){
  const s = getSelection(), caret = s.rangeCount ? s.anchorNode : null;
  let hideLevel = 0, hider = null, again = false;
  for (const el of editor.children) {
    const m = /^H([123])$/.exec(el.tagName), lvl = m ? +m[1] : 0;
    if (hideLevel && lvl && lvl <= hideLevel) { hideLevel = 0; hider = null; }
    let hidden = !!hideLevel;
    // Ne jamais cacher l'endroit où l'on écrit, ni une proposition de Claude : on rouvre la section.
    if (hidden && hider && ((caret && el.contains(caret)) || el.matches('.ai-block') || el.querySelector('.ai-sg,.ai-block'))) {
      delete hider.dataset.fold; again = true; break;
    }
    if (el.classList.contains('fold-hidden') !== hidden) {
      el.classList.toggle('fold-hidden', hidden);
      if (!el.classList.length) el.removeAttribute('class');
    }
    if (!hidden && lvl && el.dataset.fold === '1') { hideLevel = lvl; hider = el; }
  }
  if (again) refold();
}
function toggleFold(h){
  if (h.dataset.fold === '1') delete h.dataset.fold; else h.dataset.fold = '1';
  // Si le curseur était dans la partie qui se replie, il remonte à la fin du titre.
  const s = getSelection();
  if (h.dataset.fold === '1' && s.rangeCount && editor.contains(s.anchorNode) && !h.contains(s.anchorNode)) {
    const n = s.anchorNode, after = h.compareDocumentPosition(n) & Node.DOCUMENT_POSITION_FOLLOWING;
    if (after) { const r = document.createRange(); r.selectNodeContents(h); r.collapse(false); setRange(r); }
  }
  refold(); changed();
}
function foldAll(fold){
  editor.querySelectorAll(':scope > :is(h1,h2,h3)').forEach(h => { if (fold) h.dataset.fold = '1'; else delete h.dataset.fold; });
  if (fold) { const first = editor.querySelector(':scope > :is(h1,h2,h3)'); if (first) { const r = document.createRange(); r.selectNodeContents(first); r.collapse(false); setRange(r); } }
  refold(); changed();
}
// La flèche est dessinée à gauche du titre : un clic à gauche du texte du titre la déclenche.
editor.addEventListener('mousedown', e => {
  const h = e.target instanceof Element && e.target.closest('h1,h2,h3');
  if (!h || h.parentElement !== editor) return;
  const left = h.getBoundingClientRect().left + parseFloat(getComputedStyle(h).paddingLeft || 0);
  if (e.clientX >= left - 2) return;
  e.preventDefault(); toggleFold(h);
});

/* ---------- Barre d'outils : toujours en haut, masquable ----------
   Sur iPad, quand le clavier est ouvert, Safari fait glisser la page sous l'écran : on recale
   la barre sur la partie visible pour qu'elle ne disparaisse jamais en défilant. */
const barEl = $('.bar'), barToggle = $('#bar-toggle');
function syncBarHeight(){ document.documentElement.style.setProperty('--bar-h', barEl.offsetHeight + 'px'); }
new ResizeObserver(syncBarHeight).observe(barEl);
function placeBar(){
  // On ne recale la barre que lorsque le clavier occupe vraiment l'écran : pendant l'effet
  // d'élastique en bout de document, Safari fait aussi varier offsetTop, et la barre suivait.
  const vv = window.visualViewport;
  const keyboard = vv && innerHeight - vv.height > 120;
  const off = keyboard ? Math.max(0, Math.min(vv.offsetTop, innerHeight - vv.height)) : 0;
  barEl.style.transform = off ? `translateY(${off}px)` : '';
  document.documentElement.style.setProperty('--vv-top', off + 'px');
}
window.visualViewport?.addEventListener('scroll', placeBar);
window.visualViewport?.addEventListener('resize', placeBar);
function setBarHidden(h){
  document.body.classList.toggle('bar-hidden', h);
  store.set('plume-bar-hidden', h ? '1' : '0');
  const label = h ? "Afficher la barre d'outils" : "Masquer la barre d'outils";
  barToggle.title = label; barToggle.setAttribute('aria-label', label);
  if (h) closePop();
  syncBarHeight();
}
barToggle.addEventListener('mousedown', e => e.preventDefault()); // garder le curseur dans le texte
barToggle.addEventListener('click', () => setBarHidden(!document.body.classList.contains('bar-hidden')));

/* ---------- Copier le style (pinceau) ----------
   1. Le curseur dans un texte mis en forme, appuyer sur le pinceau : le style est copié.
   2. Sélectionner un autre texte : il prend ce style (couleur, surlignage, soulignement,
      police, taille, gras, italique, barré). Échap ou un nouvel appui annule. */
let painter = null;
const paintBtn = $('#paint-btn');
function copyStyle(){
  const el = anchorEl(); if (!el) { toast('Place d\'abord le curseur dans le texte dont tu veux copier le style.'); return; }
  const st = { cmd: {} };
  for (const cat of ['c','h','u','f','s']) {
    const n = el.closest(`[data-${cat}]`);
    st[cat] = n && editor.contains(n) ? n.getAttribute(`data-${cat}`) : null;
    if (cat === 'c' && st.c === 'perso') st.cExtra = { light: n.style.getPropertyValue('--cl').trim(), dark: n.style.getPropertyValue('--cd').trim() };
  }
  for (const c of ['bold','italic','strikeThrough','subscript','superscript']) { try { st.cmd[c] = document.queryCommandState(c); } catch(e) { st.cmd[c] = false; } }
  painter = st;
  document.body.classList.add('painting'); paintBtn.setAttribute('aria-pressed', 'true');
  toast('Style copié. Sélectionne le texte à mettre en forme.');
}
function stopPainting(){ painter = null; document.body.classList.remove('painting'); paintBtn.setAttribute('aria-pressed', 'false'); }
function pasteStyle(){
  const st = painter; stopPainting();
  const s = getSelection(); if (!s.rangeCount || s.isCollapsed || !editor.contains(s.anchorNode)) return;
  saved = s.getRangeAt(0).cloneRange();
  for (const cat of ['c','h','u','f','s']) applyProp(cat, st[cat], cat === 'c' ? st.cExtra : undefined);
  restore();
  for (const c of ['bold','italic','strikeThrough','subscript','superscript']) {
    let on = false; try { on = document.queryCommandState(c); } catch(e) {}
    if (on !== st.cmd[c]) document.execCommand(c);
  }
  hideSelbar(); changed(); queueToolbar();
  toast('Style appliqué');
}
paintBtn.addEventListener('click', () => painter ? stopPainting() : copyStyle());
// La sélection est terminée (souris lâchée, doigt levé, Maj relâchée) : on applique le style copié.
function maybePaint(){ if (!painter) return; const s = getSelection(); if (s.rangeCount && !s.isCollapsed && editor.contains(s.anchorNode)) pasteStyle(); }
document.addEventListener('mouseup', () => setTimeout(maybePaint, 0));
document.addEventListener('touchend', () => setTimeout(maybePaint, 300));
editor.addEventListener('keyup', e => { if (e.key === 'Shift') maybePaint(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && painter) stopPainting(); });

/* ---------- Notes (commentaires) ----------
   Une note est un <span data-n="id" data-nt="texte de la note"> autour du passage commenté :
   elle suit le texte quand on le déplace, et s'enregistre avec le document. */
const notesSide = $('#notes-side'), ntList = $('#nt-list'), notesBtn = $('#notes-btn');
const noteSpans = id => [...editor.querySelectorAll(`[data-n="${CSS.escape(id)}"]`)];
function noteIds(){ const ids = []; editor.querySelectorAll('[data-n]').forEach(e => { if (!ids.includes(e.dataset.n)) ids.push(e.dataset.n); }); return ids; }
function noteText(id){ const s = noteSpans(id).find(e => e.dataset.nt); return s ? s.dataset.nt : ''; }
function updateNotesCount(){ const n = noteIds().length; $('#notes-count').textContent = n || ''; }
function addNote(){
  const s = getSelection();
  if (!s.rangeCount || s.isCollapsed || !editor.contains(s.anchorNode)) { toast('Sélectionne d\'abord le passage à commenter.'); return; }
  saved = s.getRangeAt(0).cloneRange();
  const id = 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  applyProp('n', id);
  noteSpans(id).forEach(e => e.setAttribute('data-nt', ''));
  if (!noteSpans(id).length) return;
  hideSelbar(); openNotes(id, true); changed();
}
function deleteNote(id){
  noteSpans(id).forEach(e => { e.removeAttribute('data-nt'); clearProp(e, 'n'); });
  editor.normalize(); renderNotes(); changed();
}
function setNoteText(id, text){ noteSpans(id).forEach((e, i) => e.setAttribute('data-nt', i === 0 ? text : '')); changed(); }
function renderNotes(){
  updateNotesCount();
  if (notesSide.hidden) return;
  const ids = noteIds();
  $('#nt-title').textContent = ids.length ? `Notes · ${ids.length}` : 'Notes';
  if (!ids.length) { ntList.innerHTML = '<p class="nt-empty">Aucune note pour l\'instant. Sélectionne un passage, puis « Commenter » dans la bulle qui apparaît (ou Ctrl+Alt+M).</p>'; return; }
  ntList.replaceChildren(...ids.map(id => {
    const c = document.createElement('article'); c.className = 'nt-card'; c.dataset.id = id;
    const q = document.createElement('p'); q.className = 'nt-quote';
    const t = noteSpans(id).map(e => e.textContent).join(' ').replace(/​/g, '').trim();
    q.textContent = '« ' + (t.length > 140 ? t.slice(0, 140) + '…' : t) + ' »';
    const ta = document.createElement('textarea'); ta.className = 'nt-text'; ta.rows = 1; ta.placeholder = 'Écris ta note…';
    ta.value = noteText(id); ta.setAttribute('aria-label', 'Note sur « ' + t.slice(0, 40) + ' »');
    const acts = document.createElement('div'); acts.className = 'nt-acts';
    acts.innerHTML = '<button class="btn" data-a="del">Supprimer la note</button>';
    c.append(q, ta, acts);
    return c;
  }));
  ntList.querySelectorAll('.nt-text').forEach(growNote);
}
function growNote(ta){ ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
function highlightNote(id){
  editor.querySelectorAll('[data-n].on').forEach(e => e.classList.remove('on'));
  ntList.querySelectorAll('.nt-card.on').forEach(c => c.classList.remove('on'));
  if (!id) return;
  noteSpans(id).forEach(e => e.classList.add('on'));
  const c = ntList.querySelector(`.nt-card[data-id="${CSS.escape(id)}"]`);
  if (c) { c.classList.add('on'); c.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}
function openNotes(id, focus){
  notesSide.hidden = false; document.body.classList.add('notes-open'); notesBtn.setAttribute('aria-pressed', 'true');
  renderNotes();
  if (id) { highlightNote(id); if (focus) ntList.querySelector(`.nt-card[data-id="${CSS.escape(id)}"] .nt-text`)?.focus(); }
}
function closeNotes(){
  notesSide.hidden = true; document.body.classList.remove('notes-open'); notesBtn.setAttribute('aria-pressed', 'false');
  highlightNote(null);
}
notesBtn.addEventListener('click', () => notesSide.hidden ? openNotes() : closeNotes());
$('#nt-close').addEventListener('click', closeNotes);
ntList.addEventListener('input', e => {
  const ta = e.target.closest('.nt-text'); if (!ta) return;
  growNote(ta); setNoteText(ta.closest('.nt-card').dataset.id, ta.value);
});
// Une note laissée vide est retirée quand on la quitte.
ntList.addEventListener('focusout', e => {
  const ta = e.target.closest('.nt-text'); if (!ta) return;
  const id = ta.closest('.nt-card').dataset.id;
  setTimeout(() => { if (!ta.value.trim() && document.activeElement !== ta && noteSpans(id).length) deleteNote(id); }, 150);
});
ntList.addEventListener('click', e => {
  const c = e.target.closest('.nt-card'); if (!c) return;
  const id = c.dataset.id;
  if (e.target.closest('[data-a="del"]')) { deleteNote(id); return; }
  highlightNote(id);
  if (!e.target.closest('.nt-text')) noteSpans(id)[0]?.scrollIntoView({ block: 'center', behavior: 'smooth' });
});
// Toucher un passage commenté : sa note apparaît dans le panneau.
editor.addEventListener('click', e => {
  const n = e.target instanceof Element && e.target.closest('[data-n]');
  if (!n || !editor.contains(n)) return;
  openNotes(n.dataset.n, false);
});
let ntT = 0;
editor.addEventListener('input', () => { clearTimeout(ntT); ntT = setTimeout(() => { updateNotesCount(); if (!notesSide.hidden && !notesSide.contains(document.activeElement)) renderNotes(); }, 400); });

/* ---------- Mode concentration ---------- */
let focusOn = store.get('plume-focus') !== '0';
function markCurrent(){
  const el = anchorEl(); if (!el) return;
  const b = el.closest(BLOCKS);
  const cur = b && editor.contains(b) ? b : null;
  editor.querySelectorAll('.is-cur').forEach(x => { if (x !== cur) { x.classList.remove('is-cur'); if (!x.classList.length) x.removeAttribute('class'); } });
  cur?.classList.add('is-cur');
  editor.classList.toggle('has-cur', !!cur);
  const hl = cur && cur.parentElement === editor && /^H([123])$/.exec(cur.tagName);
  for (const n of [1, 2, 3]) editor.classList.toggle('cur-h' + n, !!hl && +hl[1] === n);
}
function applyFocus(){
  editor.classList.toggle('focus-on', focusOn);
  const b = $('#focus-btn'); b.setAttribute('aria-pressed', focusOn);
}
$('#focus-btn').addEventListener('click', () => {
  focusOn = !focusOn; store.set('plume-focus', focusOn ? '1' : '0'); applyFocus();
  toast(focusOn ? 'Mode concentration activé' : 'Mode concentration désactivé');
  restore();
});

// Retrouve un passage dans le texte, même s'il traverse plusieurs mises en forme.
const normCh = c => (c === '’' || c === '‘') ? "'" : (c === ' ' || c === ' ') ? ' ' : (c === '“' || c === '”') ? '"' : c;
function locate(q){
  const w = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest('.math,.ai-sg') ? 2 : 1 });
  const chars = [], map = [];
  while (w.nextNode()) {
    const n = w.currentNode;
    for (let i = 0; i < n.data.length; i++) { const ch = n.data[i]; if (ch === '​') continue; chars.push(normCh(ch)); map.push([n, i]); }
  }
  const s = chars.join(''), nq = [...q.replace(/​/g, '')].map(normCh).join('');
  const k = nq ? s.indexOf(nq) : -1; if (k < 0) return null;
  const a = map[k], b = map[k + nq.length - 1], r = document.createRange();
  r.setStart(a[0], a[1]); r.setEnd(b[0], b[1] + 1); return r;
}

/* ---------- Onglets : plusieurs documents ouverts ----------
   La liste est dans « plume-docs », chaque document dans « plume-doc:<id> ». */
const tabbar = $('#tabbar');
let docs = [], activeId = null, closeArm = null, closeArmT = 0;
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function loadDocs(){ try { docs = JSON.parse(store.get('plume-docs') || '[]'); } catch(e) { docs = []; } if (!Array.isArray(docs)) docs = []; }
function saveDocs(){ store.set('plume-docs', JSON.stringify(docs)); }
function docTitle(){
  const c = editor.cloneNode(true); resolveSuggestions(c);
  c.querySelectorAll('.math').forEach(m => m.replaceWith(m.dataset.tex || ''));
  for (const el of c.querySelectorAll('h1,h2,h3,p,li,blockquote,div')) {
    const t = el.textContent.replace(/[​\s]+/g, ' ').trim();
    if (t) return t.length > 32 ? t.slice(0, 32) + '…' : t;
  }
  return 'Sans titre';
}
function renderTabs(){
  tabbar.innerHTML = docs.map(d =>
    `<button class="tab" role="tab" data-id="${esc(d.id)}" aria-selected="${d.id === activeId}" title="${esc(d.title)}"><span class="t">${esc(d.title)}</span><span class="x" data-close title="Fermer l'onglet" aria-label="Fermer l'onglet">×</span></button>`
  ).join('') + '<button class="tab-add" id="tab-add" title="Nouvel onglet" aria-label="Nouvel onglet">+</button>';
}
function openDoc(id){
  if (id === activeId) return;
  if (activeId) save();
  aiCtl?.abort(); cpCtl?.abort(); closePop(); hideSelbar(); cp.hidden = true; closeMath(false);
  activeId = id; store.set('plume-active', id);
  const html = store.get('plume-doc:' + id);
  editor.innerHTML = sanitize(html && html.trim() ? html : '<p><br></p>');
  renderAllMath(); refold(); renderNotes(); dockMsg = ''; updateDock(); updateEmpty();
  statusEl.textContent = countLabel();
  window.scrollTo(0, 0); renderTabs(); restoreToStart(); markCurrent();
  tabbar.querySelector('[aria-selected="true"]')?.scrollIntoView({ inline: 'nearest', block: 'nearest' });
  centerSoon();
}
function newDoc(){
  const id = newId();
  docs.push({ id, title: 'Sans titre', updated: Date.now() });
  store.set('plume-doc:' + id, '<p><br></p>'); saveDocs();
  openDoc(id);
}
function closeDoc(id){
  const i = docs.findIndex(d => d.id === id); if (i < 0) return;
  if (id === activeId) save();
  // Un onglet fermé part dans une petite corbeille (les 10 derniers), pour pouvoir le rouvrir.
  try {
    const trash = JSON.parse(store.get('plume-trash') || '[]');
    trash.unshift({ title: docs[i].title, html: store.get('plume-doc:' + id) || '' });
    store.set('plume-trash', JSON.stringify(trash.slice(0, 10)));
  } catch(e) {}
  try { localStorage.removeItem('plume-doc:' + id); } catch(e) {}
  docs.splice(i, 1);
  if (!docs.length) { activeId = null; newDoc(); }
  else { saveDocs(); if (id === activeId) { activeId = null; openDoc(docs[Math.min(i, docs.length - 1)].id); } else renderTabs(); }
  toast('Onglet fermé. Menu ⋯ pour le rouvrir.');
}
function reopenClosed(){
  let trash = []; try { trash = JSON.parse(store.get('plume-trash') || '[]'); } catch(e) {}
  const d = trash.shift(); if (!d) { toast('Aucun onglet fermé à rouvrir.'); return; }
  store.set('plume-trash', JSON.stringify(trash));
  const id = newId();
  docs.push({ id, title: d.title || 'Sans titre', updated: Date.now() });
  store.set('plume-doc:' + id, d.html || '<p><br></p>'); saveDocs();
  openDoc(id);
}
tabbar.addEventListener('click', e => {
  if (e.target.closest('#tab-add')) { newDoc(); return; }
  const tab = e.target.closest('.tab'); if (!tab) return;
  const id = tab.dataset.id;
  if (e.target.closest('[data-close]')) {
    const html = id === activeId ? serialize() : (store.get('plume-doc:' + id) || '');
    const empty = !html.replace(/<[^>]+>/g, '').replace(/&nbsp;|\s|​/g, '') && !/class="math"/.test(html);
    if (empty || closeArm === id) { clearTimeout(closeArmT); closeArm = null; closeDoc(id); return; }
    // Un document qui contient du texte demande un deuxième clic.
    closeArm = id; tab.classList.add('confirm'); tab.querySelector('.t').textContent = 'Fermer ?';
    clearTimeout(closeArmT); closeArmT = setTimeout(() => { closeArm = null; renderTabs(); }, 2500);
    return;
  }
  openDoc(id);
});
tabbar.addEventListener('auxclick', e => { // clic molette : fermer
  const tab = e.target.closest('.tab'); if (e.button === 1 && tab) { e.preventDefault(); closeArm = tab.dataset.id; tab.querySelector('[data-close]').click(); }
});
// Plume ouverte dans un autre onglet du navigateur : on suit la liste des documents.
window.addEventListener('storage', e => { if (e.key === 'plume-docs') { loadDocs(); if (docs.find(d => d.id === activeId)) renderTabs(); } });

/* ---------- Plein écran : Plume seule, sans la barre de claude.ai ---------- */
const fsBtn = $('#fs-btn');
fsBtn.hidden = !(document.fullscreenEnabled || document.webkitFullscreenEnabled) || store.get('plume-fs-ko') === '1';
const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function requestFs(){
  const el = document.documentElement;
  let p; try { p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); } catch(e) {}
  if (p && p.catch) p.catch(() => {});
  setTimeout(() => {
    if (isFs()) return;
    fsBtn.hidden = true; autoFs = false; store.set('plume-fs-ko', '1');
    toast(window.plumeStandalone ? "Le plein écran n'est pas disponible ici. Bouton retiré." : "Le plein écran n'est pas autorisé ici par claude.ai. Bouton retiré.");
  }, 800);
}
function fsIcon(){
  const on = isFs();
  fsBtn.innerHTML = on
    ? '<svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  fsBtn.title = on ? 'Quitter le plein écran (Échap)' : 'Plein écran';
  fsBtn.setAttribute('aria-pressed', on);
}
fsBtn.addEventListener('click', async () => {
  try {
    if (isFs()) await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else requestFs();
  } catch(e) {}
});
// Plein écran automatique : dès le premier toucher ou la première touche, Plume passe en plein écran
// et la barre de claude.ai disparaît. Une seule tentative par ouverture : si tu en sors, Plume ne t'y remet pas.
let autoFs = !window.plumeStandalone && store.get('plume-autofs') !== '0' && store.get('plume-fs-ko') !== '1', autoFsTried = false;
function tryAutoFs(e){
  if (!autoFs || autoFsTried || isFs() || fsBtn.hidden) return;
  if (e.target instanceof Element && e.target.closest('#fs-btn, [data-menu="doc"], .pop')) return;
  autoFsTried = true;
  requestFs();
}
document.addEventListener('pointerdown', tryAutoFs, true);
document.addEventListener('keydown', tryAutoFs, true);
document.addEventListener('fullscreenchange', fsIcon);
document.addEventListener('webkitfullscreenchange', fsIcon);
fsIcon();

/* ---------- Thème ---------- */
const hostTheme = document.documentElement.getAttribute('data-theme');
const THEME_ICONS = {
  auto: ['Thème : automatique (suit le système)', '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>'],
  light: ['Thème : clair', '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>'],
  dark: ['Thème : sombre', '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>']
};
let theme = store.get('plume-theme') || 'auto';
function applyTheme(){
  const root = document.documentElement;
  if (theme === 'auto') { hostTheme ? root.setAttribute('data-theme', hostTheme) : root.removeAttribute('data-theme'); }
  else root.setAttribute('data-theme', theme);
  const [label, icon] = THEME_ICONS[theme];
  const b = $('#theme-btn'); b.innerHTML = icon; b.title = label; b.setAttribute('aria-label', label);
  queueToolbar();
}
$('#theme-btn').addEventListener('click', () => {
  theme = { auto:'light', light:'dark', dark:'auto' }[theme];
  store.set('plume-theme', theme); applyTheme(); toast(THEME_ICONS[theme][0]);
});
function setWidth(w){
  const v = /^\d{3,4}px$/.test(w || '') ? w : ({ etroite:'58ch', normal:'70ch', large:'96ch' }[w] || '70ch');
  document.documentElement.style.setProperty('--measure', v);
}
// Poignées de chaque côté du texte : glisser pour choisir la largeur, double-clic pour revenir à la normale.
document.querySelectorAll('.grip').forEach(g => {
  g.addEventListener('pointerdown', e => {
    e.preventDefault(); g.setPointerCapture(e.pointerId); g.classList.add('drag');
    const sheet = $('.sheet');
    const move = ev => {
      const r = sheet.getBoundingClientRect(), cx = r.left + r.width / 2;
      const max = $('.page').clientWidth - 2 * 56;
      const w = Math.round(Math.max(320, Math.min(max, 2 * Math.abs(ev.clientX - cx))));
      setWidth(w + 'px'); toast(`Largeur du texte : ${w} px`);
    };
    const up = () => {
      g.classList.remove('drag');
      g.removeEventListener('pointermove', move); g.removeEventListener('pointerup', up); g.removeEventListener('pointercancel', up);
      store.set('plume-width', getComputedStyle(document.documentElement).getPropertyValue('--measure').trim());
    };
    g.addEventListener('pointermove', move); g.addEventListener('pointerup', up); g.addEventListener('pointercancel', up);
  });
  g.addEventListener('dblclick', () => { setWidth('normal'); store.set('plume-width', 'normal'); toast('Largeur normale'); });
});

/* ---------- Démarrage ---------- */
const SAMPLE = String.raw`
<h1>Bienvenue dans World</h1>
<p><span data-c="gris">Ceci est un texte d'exemple. Pour repartir de zéro : menu ⋯ en haut à droite, puis « Nouveau document ».</span></p>
<p>Écrivez, tout simplement. En mode clair, le texte est noir sur fond blanc ; en mode sombre, il devient <b>blanc sur fond noir</b>. Les couleurs suivent aussi : chaque teinte a une version pour chaque mode.</p>
<p>Sélectionnez un mot pour changer sa <span data-c="bleu">couleur</span>, sa <span data-s="26" style="font-size:26px">taille</span> ou sa <span data-f="caveat" data-s="26" style="font-size:26px">police</span>. Surlignez <span data-h="jaune marqueur">au marqueur</span>, <span data-h="vert plein">en aplat</span> ou <span data-h="rose contour">avec un contour</span>, et soulignez en <span data-u="ondule">ondulé</span>, en <span data-u="double">double</span>, en <span data-u="pointille">pointillé</span> ou en <span data-u="epais">trait épais</span>.</p>
<h2>Les formules</h2>
<p>Tapez une formule entre deux dollars, par exemple <code>$e^{i\pi}+1=0$</code>, et elle se met en forme dès le dollar fermant : <span class="math" data-tex="e^{i\pi} + 1 = 0"></span>. Avec deux dollars de chaque côté, elle se centre sur sa propre ligne :</p>
<p><span class="math" data-display="1" data-tex="\int_0^1 x^2\,dx = \frac{1}{3} \qquad \sum_{n=1}^{\infty} \frac{1}{n^2} = \frac{\pi^2}{6}"></span></p>
<p>Cliquez sur une formule pour la modifier, ou utilisez le bouton ∑ Formule (Ctrl+M).</p>
<h2>Concentration</h2>
<p>Le mode concentration grise tout le texte sauf le paragraphe où se trouve votre curseur. Le bouton à trois lignes, en haut à droite, l'active ou le désactive. La ligne où vous écrivez reste toujours au milieu de l'écran.</p>
<p>Sélectionnez un passage pour le copier ou le rechercher sur le web.</p>
<p>Pour élargir la colonne de texte, glissez l'une des deux lignes qui apparaissent sur ses côtés quand la souris passe dessus.</p>`;

loadDocs();
if (!docs.length) {
  // Premier lancement avec les onglets : le document existant devient le premier onglet.
  const id = newId(), old = store.get('plume-doc');
  docs.push({ id, title: 'Sans titre', updated: Date.now() });
  if (store.set('plume-doc:' + id, old && old.trim() ? old : SAMPLE) && old != null) { try { localStorage.removeItem('plume-doc'); } catch(e) {} }
  saveDocs();
}
activeId = docs.find(d => d.id === store.get('plume-active')) ? store.get('plume-active') : docs[0].id;
{ const html = store.get('plume-doc:' + activeId); editor.innerHTML = sanitize(html && html.trim() ? html : SAMPLE); }
renderAllMath();
refold();
updateNotesCount();
setWidth(store.get('plume-width'));
applyTheme();
applyFocus();
applyTw();
setBarHidden(store.get('plume-bar-hidden') === '1');
placeBar();
setAiHidden(aiHidden);
updateEmpty();
statusEl.textContent = countLabel();
{ const d = docs.find(x => x.id === activeId); if (d) { d.title = docTitle(); saveDocs(); } }
renderTabs();
if (window.MathJax && MathJax.startup && MathJax.startup.promise && MathJax.tex2svgPromise) window.plumeMathReady();
})();
</script>
